<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeWorld｜人生地图</title>

<style>
* { box-sizing: border-box; }
html, body { height: 100%; }

body {
    margin: 0;
    background: #080b12;
    color: white;
    font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    overflow: hidden;
}

button {
    border: none;
    padding: 12px 24px;
    border-radius: 30px;
    background: #ffffff;
    color: #111;
    font-size: 16px;
    cursor: pointer;
    transition: 0.25s;
    font-family: inherit;
}
button:hover { transform: scale(1.05); }
button.ghost {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 9px 16px;
    font-size: 14px;
}

.screen { position: absolute; inset: 0; }

/* ---------- 首页 ---------- */
#startScreen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: radial-gradient(circle at center, #25345c 0%, #111827 35%, #080b12 75%);
}
#startScreen h1 { font-size: 64px; margin: 0 0 15px; letter-spacing: 4px; }
.subtitle { font-size: 20px; color: #aab4c8; margin-bottom: 50px; padding: 0 20px; }

/* ---------- 创建角色 ---------- */
#createScreen {
    display: none;
    overflow-y: auto;
    padding: 30px 20px 50px;
    background: radial-gradient(circle at 20% 10%, #1f2d52 0%, #0d1220 50%, #080b12 90%);
}
.createWrap {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
}
.previewBox {
    width: 280px;
    text-align: center;
}
.previewBox .stage {
    height: 330px;
    border-radius: 24px;
    background: radial-gradient(circle at 50% 60%, #2a3b66 0%, #131a2c 70%);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
}
.previewBox .stage svg { height: 300px; width: auto; }
.previewBox input {
    margin-top: 16px;
    width: 100%;
    padding: 12px 16px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 16px;
    text-align: center;
    font-family: inherit;
}
.formBox { flex: 1; min-width: 300px; max-width: 620px; }
.formBox h2 { margin: 0 0 6px; }
.formBox h3 { margin: 22px 0 10px; font-size: 15px; color: #aab4c8; font-weight: normal; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.sw {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer; transition: 0.2s;
}
.sw:hover { transform: scale(1.12); }
.sw.sel, .opt.sel { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.25); }
.opt {
    padding: 10px 16px;
    border-radius: 14px;
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,255,255,0.12);
    cursor: pointer; font-size: 14px;
    transition: 0.2s;
}
.opt:hover { background: rgba(255,255,255,0.14); }
.opt small { display: block; color: #9aa4b8; margin-top: 4px; font-size: 12px; }
.cards .opt { width: calc(50% - 5px); }
.createBtn { margin-top: 30px; width: 100%; font-size: 18px; padding: 15px; }

/* ---------- 世界 ---------- */
#worldScreen { display: none; flex-direction: column; }

.hud {
    display: flex; align-items: center; flex-wrap: wrap; gap: 18px;
    padding: 8px 20px;
    background: rgba(15,20,30,0.92);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    z-index: 5;
}
#hudAvatar { width: 62px; height: 76px; flex: none; }
#hudAvatar svg, #token svg { width: 100%; height: 100%; display: block; }
.hudInfo { min-width: 110px; }
#hudName { font-size: 18px; font-weight: bold; }
#hudAge { font-size: 13px; color: #aab4c8; margin-top: 3px; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; flex: 1; }
.stat { width: 120px; font-size: 12px; color: #c4cce0; }
.bar { height: 8px; background: #222c40; border-radius: 6px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; transition: width 0.6s; }
.hudBtns { display: flex; gap: 10px; }

#world {
    flex: 1; position: relative; overflow: hidden;
    background:
        radial-gradient(circle at 30% 40%, #19314c 0%, transparent 25%),
        radial-gradient(circle at 70% 65%, #30214b 0%, transparent 25%),
        #090d16;
}
#paths { position: absolute; inset: 0; width: 100%; height: 100%; }
#paths polyline {
    fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 2;
    stroke-dasharray: 4 8; vector-effect: non-scaling-stroke;
}

.place {
    position: absolute;
    width: 112px; height: 112px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: flex; justify-content: center; align-items: center;
    text-align: center; font-size: 13px; line-height: 1.5;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: 0.3s;
    z-index: 1;
}
.place:hover { transform: translate(-50%, -50%) scale(1.12); background: rgba(255,255,255,0.18); }
.place.active { box-shadow: 0 0 28px rgba(140,170,255,0.55); border-color: #a9bcff; }
.place .ic { font-size: 28px; display: block; }
.badge {
    position: absolute; top: 2px; right: 2px;
    min-width: 24px; height: 24px; border-radius: 12px;
    background: #ffd166; color: #222; font-size: 12px; font-weight: bold;
    display: none; align-items: center; justify-content: center; padding: 0 6px;
}

#token {
    position: absolute; width: 56px; height: 70px;
    transform: translate(-50%, -50%);
    margin: 14px 0 0 92px;
    transition: left 1.1s ease, top 1.1s ease;
    pointer-events: none; z-index: 3;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}

/* 事件弹窗 */
#eventModal {
    display: none; position: absolute; inset: 0; z-index: 20;
    background: rgba(5,8,15,0.72);
    align-items: center; justify-content: center; padding: 14px;
}
.card {
    width: min(660px, 100%); max-height: 92%; overflow-y: auto;
    background: rgba(18,24,38,0.98);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 22px; padding: 26px 28px;
    animation: pop 0.35s;
}
@keyframes pop { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.evMeta { color: #8fa0c8; font-size: 13px; letter-spacing: 1px; }
.card h2 { margin: 8px 0 10px; font-size: 26px; }
.card p.txt { color: #d3d9e8; line-height: 1.8; margin: 0 0 14px; }
.choice {
    display: block; width: 100%; text-align: left;
    margin: 10px 0; border-radius: 14px;
    background: rgba(255,255,255,0.08); color: #fff;
    border: 1px solid rgba(255,255,255,0.18);
    padding: 14px 18px; line-height: 1.5;
}
.choice:hover { background: rgba(255,255,255,0.19); transform: translateX(5px); }
.chip { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 13px; margin: 6px 6px 0 0; }
.chip.up { background: rgba(80,200,120,0.2); color: #8be8a8; }
.chip.down { background: rgba(255,100,100,0.2); color: #ff9d9d; }
.chip.frag { background: rgba(255,209,102,0.2); color: #ffd166; }
.resChoice { color: #8fa0c8; font-size: 14px; }
#resText { font-size: 18px; line-height: 1.8; margin: 10px 0 8px; }

/* 地点信息 */
#infoPanel {
    display: none; position: absolute; right: 24px; bottom: 24px; z-index: 10;
    width: 340px; max-height: 70%; overflow-y: auto;
    padding: 22px; border-radius: 20px;
    background: rgba(15,20,30,0.94);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
}
#infoPanel h2 { margin: 0 0 8px; }
.close { float: right; cursor: pointer; color: #aaa; font-size: 18px; }
.fr { padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.08); font-size: 13px; line-height: 1.6; color: #cdd5e6; }
.fr.dim { color: #7c869b; }
.fr b { color: #ffd166; }

/* 全屏层 */
.overlay {
    display: none; position: absolute; inset: 0; z-index: 50;
    background: rgba(5,8,15,0.97);
    padding: 50px 30px; overflow-y: auto; text-align: center;
}
.people { display: flex; justify-content: center; gap: 26px; margin-top: 40px; flex-wrap: wrap; }
.person {
    width: 150px; padding: 18px 8px; border-radius: 24px;
    background: #1b2538; transition: 0.3s; font-size: 14px;
}
.person .em { font-size: 40px; display: block; margin-bottom: 6px; }
.person.can { cursor: pointer; }
.person.can:hover { transform: scale(1.1); background: #35466b; }
.person.lock { opacity: 0.35; }
.person .bar { margin: 10px 14px 0; }
.person .bar i { background: #ff8fa8; }

.fragList { max-width: 640px; margin: 24px auto 0; text-align: left; }
.fragList .fr { font-size: 15px; padding: 12px 0; }

/* 人生总结 */
#summary { background: radial-gradient(circle at center, #1d2a4a 0%, #080b12 70%); }
#summary .av { width: 130px; height: 160px; margin: 10px auto; }
#summary .av svg { width: 100%; height: 100%; }
#summary h1 { margin: 6px 0; font-size: 34px; }
#summary .lt { color: #ffd166; font-size: 20px; margin: 4px 0 14px; }
#summary .sd { color: #aab4c8; line-height: 1.8; max-width: 560px; margin: 0 auto 14px; }

/* Ending */
#ending {
    display: none; position: absolute; inset: 0; z-index: 80;
    background: #05070c; overflow-y: auto;
    flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 30px;
}
#ending h1 { font-size: 42px; max-width: 800px; line-height: 1.5; margin: 14px 0; }
#ending p { color: #9299a8; font-size: 18px; line-height: 1.8; max-width: 640px; }
.fade { opacity: 0; animation: fadeIn 2s forwards; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

#toast {
    position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.95); color: #111;
    padding: 10px 22px; border-radius: 24px; z-index: 200;
    display: none; font-size: 15px;
}

@media (max-width: 700px) {
    #startScreen h1 { font-size: 44px; }
    .place { width: 86px; height: 86px; font-size: 11px; }
    .place .ic { font-size: 22px; }
    #token { margin-left: 62px; width: 44px; height: 56px; }
    #infoPanel { right: 10px; left: 10px; width: auto; }
    .stat { width: 100px; }
    #ending h1 { font-size: 30px; }
}
</style>
</head>

<body>

<!-- ================= 首页 ================= -->
<div id="startScreen" class="screen">
    <h1>LifeWorld</h1>
    <div class="subtitle">把碎片拼成世界，把世界留给眼前人。</div>
    <button id="startBtn" onclick="openCreate()">开始构建我的世界</button>
</div>

<!-- ================= 创建角色 ================= -->
<div id="createScreen" class="screen">
    <div class="createWrap">
        <div class="previewBox">
            <div class="stage" id="preview"></div>
            <input id="nameInput" maxlength="12" placeholder="给你的主角起个名字" oninput="buildCreate()">
        </div>
        <div class="formBox">
            <h2>塑造你的形象</h2>
            <div style="color:#8fa0c8;font-size:13px">你的样子会随着年龄慢慢改变：长大、变老，头发也会变白。</div>

            <h3>发型</h3><div class="row" id="hairStyles"></div>
            <h3>发色</h3><div class="row" id="hairColors"></div>
            <h3>肤色</h3><div class="row" id="skins"></div>
            <h3>衣服颜色</h3><div class="row" id="shirts"></div>
            <h3>配饰</h3><div class="row" id="glassesRow"></div>
            <h3>出生的家庭</h3><div class="row cards" id="familyList"></div>
            <h3>天生的性格</h3><div class="row cards" id="traitList"></div>

            <button id="beginBtn" class="createBtn" onclick="beginLife()">降生到这个世界 →</button>
        </div>
    </div>
</div>

<!-- ================= 世界 ================= -->
<div id="worldScreen" class="screen">

    <div class="hud">
        <div id="hudAvatar"></div>
        <div class="hudInfo">
            <div id="hudName"></div>
            <div id="hudAge"></div>
        </div>
        <div class="stats" id="hudStats"></div>
        <div class="hudBtns">
            <button class="ghost" onclick="openPeople(false)">👥 People in My World</button>
            <button class="ghost" onclick="openFrags()">🧩 人生碎片</button>
        </div>
    </div>

    <div id="world">
        <svg id="paths" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="pathLine" points=""/></svg>
        <div id="token"></div>

        <!-- 事件 -->
        <div id="eventModal">
            <div class="card">
                <div class="evMeta" id="evMeta"></div>
                <h2 id="evTitle"></h2>
                <div id="evChoicesWrap">
                    <p class="txt" id="evText"></p>
                    <div id="evChoices"></div>
                </div>
                <div id="evResult" style="display:none">
                    <div class="resChoice" id="resChoice"></div>
                    <div id="resText"></div>
                    <div id="resChips"></div>
                    <div style="text-align:right;margin-top:20px">
                        <button id="contBtn" onclick="cont()">继续 →</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 地点信息 -->
        <div id="infoPanel">
            <span class="close" onclick="closePanel()">✕</span>
            <h2 id="placeTitle"></h2>
            <p id="placeText" style="color:#cdd5e6;line-height:1.7"></p>
            <p id="placePeople" style="color:#8fa0c8"></p>
            <div id="placeFrags"></div>
        </div>
    </div>

    <!-- 人物 -->
    <div id="peopleScreen" class="overlay">
        <h1 id="peopleTitle">Who makes your world meaningful?</h1>
        <p id="peopleSub">选择一个你想留下的人</p>
        <div class="people" id="peopleList"></div>
        <div style="margin-top:40px"><button id="peopleClose" class="ghost" onclick="closePeople()">返回</button></div>
    </div>

    <!-- 碎片墙 -->
    <div id="fragScreen" class="overlay">
        <h1>🧩 你的人生碎片</h1>
        <p style="color:#9aa4b8">每一个选择，都会留下一块碎片。</p>
        <div class="fragList" id="fragList"></div>
        <div style="margin-top:30px"><button class="ghost" onclick="$('fragScreen').style.display='none'">返回</button></div>
    </div>

    <!-- 人生总结 -->
    <div id="summary" class="overlay">
        <div class="av" id="sumAvatar"></div>
        <h1 id="sumName"></h1>
        <div class="lt" id="sumTitle"></div>
        <div class="sd" id="sumDesc"></div>
        <div id="sumChips"></div>
        <div style="margin-top:30px"><button onclick="openPeople(true)">选择一个想留下的人 →</button></div>
    </div>

    <!-- Ending -->
    <div id="ending"></div>
</div>

<div id="toast"></div>

<script>
/* ================= BGM ================= */
// 音频文件放在 HTML 同目录下的 audio 文件夹里：audio/main.mp3 和 audio/sad.mp3
const bgmMain = new Audio('audio/main.mp3');
const bgmSad  = new Audio('audio/sad.mp3');
bgmMain.loop = true;
bgmSad.loop  = true;
const BGM_VOL = 0.5;
bgmMain.volume = BGM_VOL;
bgmSad.volume  = 0;

let bgmStarted = false;

// 浏览器禁止自动播放，必须等玩家第一次点击/触摸
function startBGM() {
    if (bgmStarted) return;
    bgmStarted = true;
    bgmMain.play().catch(() => { bgmStarted = false; });
}
document.addEventListener('click', startBGM);
document.addEventListener('touchstart', startBGM);

// 音量渐变
function fadeAudio(audio, to, ms, onDone) {
    const from = audio.volume, steps = 40;
    let i = 0;
    const timer = setInterval(() => {
        i++;
        audio.volume = Math.min(1, Math.max(0, from + (to - from) * i / steps));
        if (i >= steps) { clearInterval(timer); if (onDone) onDone(); }
    }, ms / steps);
}

// 切到伤感 BGM（最后一幕）
function switchToSad() {
    fadeAudio(bgmMain, 0, 2000, () => bgmMain.pause());
    bgmSad.currentTime = 0;
    bgmSad.play().catch(() => {});
    fadeAudio(bgmSad, BGM_VOL, 3000);
}

// 切回主 BGM（再活一次）
function switchToMain() {
    fadeAudio(bgmSad, 0, 1500, () => bgmSad.pause());
    bgmMain.currentTime = 0;
    bgmMain.play().catch(() => {});
    fadeAudio(bgmMain, BGM_VOL, 1500);
}

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= 基础数据 ================= */

const STAT = {
    h: ['健康', '❤️', '#ff6b81'],
    j: ['快乐', '😊', '#ffd166'],
    w: ['智慧', '📚', '#6c9bff'],
    m: ['财富', '💰', '#5ee0a0']
};
const BOND = {
    mom:  ['妈妈', '👩'],
    dad:  ['爸爸', '👨'],
    fri:  ['朋友', '🧑'],
    love: ['爱人', '💞'],
    kid:  ['孩子', '🧒'],
    men:  ['恩师', '🧓']
};
const BOND_LINE = {
    mom:  '她在你还不会说话的时候，就读懂了你。',
    dad:  '他不太会说，却把所有的爱都放在了行动里。',
    fri:  '那些一起笑过、闹过、沉默过的日子，从来没有走远。',
    love: '你们把平凡的日子，过成了最长的一首诗。',
    kid:  '你在TA身上，看见了自己的过去，也看见了未来。',
    men:  '有人曾点亮你的路，你后来也成了别人的光。'
};

const PLACES = {
    home:       { icon: '🏠', name: 'Home · 家',        x: 14, y: 58, desc: '这里保存着与你的家庭有关的记忆。', people: '👤 People: Mom, Dad, 爱人, 孩子' },
    school:     { icon: '🏫', name: 'School · 校园',    x: 30, y: 28, desc: '书包、操场、考试、第一次心动，和永远记得的同桌。', people: '👤 People: Friends' },
    university: { icon: '🎓', name: 'University · 大学', x: 50, y: 52, desc: '新的阶段从这里开始。学习、比赛、朋友，以及第一次尝试 AI。', people: '👤 People: Friends' },
    work:       { icon: '🏢', name: 'Work · 工作',      x: 68, y: 26, desc: '第一份工作、第一笔工资，第一次学会妥协，也第一次学会坚持。', people: '👤 People: 同事, 恩师' },
    travel:     { icon: '✈️', name: 'Travel · 旅途',    x: 85, y: 56, desc: '一些地方最终会变成记忆，而一些记忆最终会变成故事。', people: '👤 People: Friends, 爱人' },
    future:     { icon: '🚀', name: 'Future · 未来',    x: 52, y: 84, desc: '这里还没有发生任何事情。它等待着你继续填满。', people: '⭐ Dreams & Goals' }
};

const HAIRS = ['短发', '长发', '卷发', '马尾'];
const HAIRC = ['#2b1b12', '#5a3a22', '#c9a24d', '#a8321f', '#3b4a7a'];
const SKINS = ['#f6d5b8', '#e8b98f', '#c68a5b', '#8d5a3b', '#5e3a26'];
const SHIRTS = ['#4a7bd0', '#d6516b', '#3fae7a', '#e0a43a', '#8a63d2', '#e9e9ef'];

const FAMILY = [
    { n: '🏡 普通家庭',   d: '平凡温暖，什么都不多也不少。快乐 +5',          e: 'j+5 mom+5 dad+5' },
    { n: '📚 书香门第',   d: '家里到处都是书。智慧 +12',                     e: 'w+12' },
    { n: '🛍️ 小商人家庭', d: '家境宽裕，爸妈却很忙。财富 +12，亲情 -4',       e: 'm+12 mom-4 dad-4' },
    { n: '🌾 外婆的乡下', d: '慢悠悠的日子。健康 +10，快乐 +6，财富 -6',      e: 'h+10 j+6 m-6' }
];
const TRAIT = [
    { n: '🔍 好奇', d: '什么都想知道。智慧 +10',     e: 'w+10' },
    { n: '🌷 温柔', d: '更容易走进别人心里。羁绊 +4', e: 'mom+4 dad+4 fri+4' },
    { n: '🔥 坚韧', d: '摔倒了就再站起来。健康 +10',  e: 'h+10' },
    { n: '☀️ 乐观', d: '总能看到亮的一面。快乐 +12',  e: 'j+12' }
];

/* ================= 人生事件 =================
   a: 年龄范围  p: 地点  t: 标题  x: 描述
   c: [选项, 结果, 效果]   u: 该事件可以结识的羁绊
   效果: h健康 j快乐 w智慧 m财富 mom dad fri love kid men

/* ================= 角色形象 ================= */

function mix(a, b, t) {
    const pa = a.replace('#', '').match(/../g).map(x => parseInt(x, 16));
    const pb = b.replace('#', '').match(/../g).map(x => parseInt(x, 16));
    return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

function avatarSVG(o, age, joy) {
    const sc = age <= 2 ? 0.5 : (age < 18 ? 0.5 + (age - 2) * 0.03125 : 1);
    const kid = age < 13, elder = age >= 60;
    const hr = kid ? 46 : 42, hy = kid ? 100 : 92, L = 100 - hr, R = 100 + hr;

    let hc = o.hairColor;
    if (age >= 62) hc = '#dcdce2';
    else if (age >= 50) hc = mix(hc, '#cfcfd6', 0.55);
    else if (age >= 40) hc = mix(hc, '#cfcfd6', 0.2);

    const skinD = mix(o.skin, '#000000', 0.14);
    const sh = o.shirt, shD = mix(sh, '#000000', 0.22);
    let s = '';

    // 长发后层
    if (o.hair === 1)
        s += `<path d="M${L-6},${hy-5} Q${L-14},${hy+75} ${L+8},${hy+80} L${R-8},${hy+80} Q${R+14},${hy+75} ${R+6},${hy-5} Z" fill="${hc}"/>`;

    // 手臂 + 身体
    s += `<path d="M62,168 Q40,205 48,234" stroke="${sh}" stroke-width="17" fill="none" stroke-linecap="round"/>`;
    s += `<path d="M138,168 Q160,205 152,234" stroke="${sh}" stroke-width="17" fill="none" stroke-linecap="round"/>`;
    s += `<path d="M52,250 Q52,152 100,148 Q148,152 148,250 Z" fill="${sh}"/>`;
    if (age >= 6 && age <= 22)
        s += `<path d="M75,153 L71,250 M125,153 L129,250" stroke="${shD}" stroke-width="7" fill="none"/>`;
    if (age >= 23)
        s += `<path d="M84,150 L100,174 L116,150 Z" fill="#ffffff"/>`;
    s += `<circle cx="48" cy="236" r="8" fill="${o.skin}"/><circle cx="152" cy="236" r="8" fill="${o.skin}"/>`;

    // 手杖
    if (age >= 75)
        s += `<path d="M158,250 L158,200 Q158,186 146,188" stroke="#8b5a2b" stroke-width="5" fill="none" stroke-linecap="round"/>`;

    // 脖子、耳朵、头
    s += `<rect x="90" y="${hy+28}" width="20" height="${156-hy-28}" fill="${skinD}"/>`;
    s += `<circle cx="${L+1}" cy="${hy+4}" r="8" fill="${o.skin}"/><circle cx="${R-1}" cy="${hy+4}" r="8" fill="${o.skin}"/>`;
    s += `<ellipse cx="100" cy="${hy}" rx="${hr-2}" ry="${hr}" fill="${o.skin}"/>`;
    if (kid) s += `<circle cx="76" cy="${hy+16}" r="7" fill="#ff8fa8" opacity="0.3"/><circle cx="124" cy="${hy+16}" r="7" fill="#ff8fa8" opacity="0.3"/>`;

    // 前发
    const cap = `<path d="M${L-2},${hy} C${L-4},${hy-hr-8} ${R+4},${hy-hr-8} ${R+2},${hy} C${R-4},${hy-hr+14} ${L+4},${hy-hr+14} ${L-2},${hy} Z" fill="${hc}"/>`;
    if (o.hair === 2) {
        for (let i = 0; i <= 6; i++) {
            const ang = Math.PI + i * Math.PI / 6;
            s += `<circle cx="${(100 + (hr + 2) * Math.cos(ang)).toFixed(1)}" cy="${(hy + (hr + 2) * Math.sin(ang) + 4).toFixed(1)}" r="15" fill="${hc}"/>`;
        }
        s += cap;
    } else {
        s += cap;
        if (o.hair === 3)
            s += `<ellipse cx="${R+10}" cy="${hy+8}" rx="10" ry="26" fill="${hc}" transform="rotate(-14 ${R+10} ${hy+8})"/><circle cx="${R+2}" cy="${hy-14}" r="5" fill="#d6516b"/>`;
    }

    // 学士帽
    if (age >= 21 && age <= 23)
        s += `<polygon points="${L-14},${hy-hr+6} 100,${hy-hr-12} ${R+14},${hy-hr+6} 100,${hy-hr+22}" fill="#222"/><path d="M${R+4},${hy-hr+8} L${R+4},${hy-hr+34}" stroke="#e0a43a" stroke-width="3"/>`;

    // 五官
    const er = kid ? 5 : 4;
    s += `<circle cx="84" cy="${hy+4}" r="${er}" fill="#222"/><circle cx="116" cy="${hy+4}" r="${er}" fill="#222"/>`;
    if (kid) s += `<circle cx="85.5" cy="${hy+2.5}" r="1.6" fill="#fff"/><circle cx="117.5" cy="${hy+2.5}" r="1.6" fill="#fff"/>`;
    s += `<path d="M76,${hy-8} L92,${hy-9} M108,${hy-9} L124,${hy-8}" stroke="${mix(hc,'#000000',.25)}" stroke-width="2.4" stroke-linecap="round"/>`;
    s += `<path d="M100,${hy+8} q-3,8 2,10" stroke="${skinD}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    let mouth;
    if (joy >= 65) mouth = `M88,${hy+24} Q100,${hy+37} 112,${hy+24}`;
    else if (joy >= 35) mouth = `M90,${hy+27} Q100,${hy+31} 110,${hy+27}`;
    else mouth = `M90,${hy+31} Q100,${hy+22} 110,${hy+31}`;
    s += `<path d="${mouth}" stroke="#7a3b3b" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;

    // 皱纹
    if (age >= 50)
        s += `<path d="M${L+12},${hy-16} q${hr-12},-5 ${2*hr-24},0 M70,${hy+9} l-6,3 M130,${hy+9} l6,3 M80,${hy+36} q4,4 8,2 M112,${hy+38} q4,2 8,-2" stroke="rgba(0,0,0,0.22)" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;

    // 眼镜
    if (o.glasses || age >= 65)
        s += `<g stroke="#333" stroke-width="2.6" fill="rgba(255,255,255,0.14)"><circle cx="84" cy="${hy+4}" r="11"/><circle cx="116" cy="${hy+4}" r="11"/><path d="M95,${hy+4} L105,${hy+4}"/></g>`;

    const stoop = elder ? 3 : 0;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 258">` +
        `<ellipse cx="100" cy="253" rx="${(55 * sc + 12).toFixed(1)}" ry="5" fill="rgba(0,0,0,0.35)"/>` +
        `<g transform="translate(100,250) scale(${sc.toFixed(3)}) rotate(${stoop}) translate(-100,-250)">${s}</g></svg>`;
}

function stageName(age) {
    if (age < 3) return '婴儿期';
    if (age < 6) return '幼年';
    if (age < 12) return '童年';
    if (age < 18) return '少年';
    if (age < 23) return '青年 · 求学';
    if (age < 35) return '青年 · 立业';
    if (age < 50) return '壮年';
    if (age < 65) return '中年';
    return '晚年';
}

/* ================= 创建角色 ================= */

const cfg = { hair: 0, hairColor: HAIRC[0], skin: SKINS[0], shirt: SHIRTS[0], glasses: false, family: 0, trait: 0 };

function swatches(el, arr, key) {
    el.innerHTML = '';
    arr.forEach(c => {
        const d = document.createElement('span');
        d.className = 'sw' + (cfg[key] === c ? ' sel' : '');
        d.style.background = c;
        d.onclick = () => { cfg[key] = c; buildCreate(); };
        el.appendChild(d);
    });
}

function optRow(el, items, key, labelFn) {
    el.innerHTML = '';
    items.forEach((it, i) => {
        const d = document.createElement('div');
        d.className = 'opt' + (cfg[key] === i ? ' sel' : '');
        d.innerHTML = labelFn(it);
        d.onclick = () => { cfg[key] = i; buildCreate(); };
        el.appendChild(d);
    });
}

function buildCreate() {
    optRow($('hairStyles'), HAIRS, 'hair', h => h);
    swatches($('hairColors'), HAIRC, 'hairColor');
    swatches($('skins'), SKINS, 'skin');
    swatches($('shirts'), SHIRTS, 'shirt');

    const g = $('glassesRow');
    g.innerHTML = '';
    const gb = document.createElement('div');
    gb.className = 'opt' + (cfg.glasses ? ' sel' : '');
    gb.textContent = '👓 戴眼镜';
    gb.onclick = () => { cfg.glasses = !cfg.glasses; buildCreate(); };
    g.appendChild(gb);

    optRow($('familyList'), FAMILY, 'family', f => `${f.n}<small>${f.d}</small>`);
    optRow($('traitList'), TRAIT, 'trait', t => `${t.n}<small>${t.d}</small>`);

    $('preview').innerHTML = avatarSVG({ hair: cfg.hair, hairColor: cfg.hairColor, skin: cfg.skin, shirt: cfg.shirt, glasses: cfg.glasses }, 24, 70);
}

function openCreate() {
    startBGM();
    $('startScreen').style.display = 'none';
    $('createScreen').style.display = 'block';
    buildCreate();
}

/* ================= 游戏状态 ================= */

let S = null;
let peopleMode = false;

function newState() {
    return {
        name: ($('nameInput').value.trim() || '旅人'),
        o: { hair: cfg.hair, hairColor: cfg.hairColor, skin: cfg.skin, shirt: cfg.shirt, glasses: cfg.glasses },
        age: 1, h: 50, j: 50, w: 40, m: 40,
        b: { mom: 30, dad: 30, fri: 10, love: 0, kid: 0, men: 0 },
        met: new Set(['mom', 'dad', 'fri']),
        done: new Set(), frags: [], cur: null, lastStage: ''
    };
}

function applyEff(str) {
    const out = [];
    (str || '').split(' ').filter(Boolean).forEach(tok => {
        const m = tok.match(/^([a-z]+)([+-]\d+)$/);
        if (!m) return;
        const k = m[1], v = +m[2];
        if (STAT[k]) {
            const before = S[k];
            let gain = v;
            if (gain > 0 && before > 50) gain = Math.max(1, Math.round(gain * (100 - before) / 50));
            S[k] = clamp(S[k] + gain);
            const d = S[k] - before;
            if (d) out.push({ label: STAT[k][1] + STAT[k][0], d });
        } else if (BOND[k]) {
            if (!S.met.has(k)) {
                if (S.cur && S.cur.u === k && v > 0) S.met.add(k);
                else return;
            }
            const before = S.b[k];
            S.b[k] = clamp(S.b[k] + v);
            const d = S.b[k] - before;
            if (d) out.push({ label: BOND[k][1] + BOND[k][0], d });
        }
    });
    return out;
}

function beginLife() {
    S = newState();
    applyEff(FAMILY[cfg.family].e);
    applyEff(TRAIT[cfg.trait].e);
    S.lastStage = stageName(S.age);

    $('createScreen').style.display = 'none';
    $('worldScreen').style.display = 'flex';
    buildMap();
    renderHUD();
    toast('🍼 ' + S.name + ' 来到了这个世界');
    setTimeout(runTurn, 1400);
}

/* ================= 地图 & HUD ================= */

function buildMap() {
    document.querySelectorAll('.place').forEach(p => p.remove());
    const pts = [];
    ['home', 'school', 'university', 'work', 'travel', 'future', 'home'].forEach(k => pts.push(PLACES[k].x + ',' + PLACES[k].y));
    $('pathLine').setAttribute('points', pts.join(' '));

    Object.keys(PLACES).forEach(k => {
        const P = PLACES[k];
        const d = document.createElement('div');
        d.className = 'place';
        d.id = 'place_' + k;
        d.style.left = P.x + '%';
        d.style.top = P.y + '%';
        d.innerHTML = `<div><span class="ic">${P.icon}</span>${P.name.split(' · ')[0]}</div><span class="badge" id="badge_${k}">0</span>`;
        d.onclick = () => showPlace(k);
        $('world').appendChild(d);
    });
    moveToken('home');
}

function moveToken(k) {
    const P = PLACES[k];
    const t = $('token');
    t.style.left = P.x + '%';
    t.style.top = P.y + '%';
    document.querySelectorAll('.place').forEach(p => p.classList.remove('active'));
    const el = $('place_' + k);
    if (el) el.classList.add('active');
}

function updateBadges() {
    Object.keys(PLACES).forEach(k => {
        const n = S.frags.filter(f => f.place === k).length;
        const b = $('badge_' + k);
        if (!b) return;
        b.textContent = n;
        b.style.display = n ? 'flex' : 'none';
    });
}

function renderHUD() {
    const av = avatarSVG(S.o, S.age, S.j);
    $('hudAvatar').innerHTML = av;
    $('token').innerHTML = av;
    $('hudName').textContent = S.name;
    $('hudAge').textContent = `${S.age} 岁 · ${stageName(S.age)}`;
    $('hudStats').innerHTML = Object.keys(STAT).map(k =>
        `<div class="stat">${STAT[k][1]} ${STAT[k][0]} <span style="float:right">${Math.round(S[k])}</span>` +
        `<div class="bar"><i style="width:${S[k]}%;background:${STAT[k][2]}"></i></div></div>`).join('');
    updateBadges();
}

function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.style.display = 'none'; }, 2200);
}

/* ================= 地点信息 ================= */

function showPlace(k) {
    if (!S) return;
    const P = PLACES[k];
    const fr = S.frags.filter(f => f.place === k);
    $('placeTitle').textContent = P.icon + ' ' + P.name;
    $('placeText').textContent = P.desc;
    $('placePeople').textContent = P.people;
    $('placeFrags').innerHTML = fr.length
        ? fr.map(f => `<div class="fr"><b>${f.age} 岁 · ${esc(f.title)}</b><br>${esc(f.choice)}</div>`).join('')
        : '<div class="fr dim">这里还没有留下碎片。</div>';
    $('infoPanel').style.display = 'block';
}
function closePanel() { $('infoPanel').style.display = 'none'; }

/* ================= 人生流程 ================= */

function lifeEnd() {
    return Math.round(clamp(78 + (S.h - 50) / 3, 66, 92));
}

function nextEvent() {
    if (S.h <= 0) return 'dead';
    if (S.age >= lifeEnd()) return S.done.has('final') ? null : EV_FINAL;
    const c = EV.filter(e => e.id !== 'final' && !S.done.has(e.id) &&
        S.age >= e.a[0] && S.age <= e.a[1] && (!e.req || e.req(S)));
    if (!c.length) return 'skip';
    c.sort((x, y) => (x.a[1] - S.age) - (y.a[1] - S.age));
    const top = c.slice(0, 3);
    return top[Math.floor(Math.random() * top.length)];
}

function advance(y) {
    S.age += y;
    if (S.age > 50) S.h = clamp(S.h - Math.round(y * 0.8));
    if (S.age < 30 && S.h < 5) S.h = 5;
}

function runTurn() {
    let e, guard = 0;
    while (guard++ < 80) {
        e = nextEvent();
        if (e === 'skip') { advance(1); continue; }
        break;
    }
    if (e === 'dead') return endLife('health');
    if (!e || e === 'skip') return endLife('natural');
    showEvent(e);
}

function showEvent(e) {
    S.cur = e;
    closePanel();
    moveToken(e.p);
    renderHUD();
    setTimeout(() => {
        const P = PLACES[e.p];
        $('evMeta').textContent = `${P.icon} ${P.name} · ${S.age} 岁`;
        $('evTitle').textContent = e.t;
        $('evText').textContent = e.x;
        const box = $('evChoices');
        box.innerHTML = '';
        e.c.forEach((c, i) => {
            const b = document.createElement('button');
            b.className = 'choice';
            b.textContent = c[0];
            b.onclick = () => choose(i);
            box.appendChild(b);
        });
        $('evChoicesWrap').style.display = 'block';
        $('evResult').style.display = 'none';
        $('eventModal').style.display = 'flex';
    }, 1000);
}

function choose(i) {
    const e = S.cur, c = e.c[i];
    const changes = applyEff(c[2]);
    S.frags.push({ age: S.age, place: e.p, title: e.t, choice: c[0], res: c[1] });
    S.done.add(e.id);

    $('evChoicesWrap').style.display = 'none';
    $('evResult').style.display = 'block';
    $('resChoice').textContent = '你选择了：' + c[0];
    $('resText').textContent = c[1];
    $('resChips').innerHTML = changes.map(x =>
        `<span class="chip ${x.d > 0 ? 'up' : 'down'}">${x.label} ${x.d > 0 ? '+' : ''}${x.d}</span>`).join('') +
        `<span class="chip frag">🧩 获得一块人生碎片</span>`;
    renderHUD();
}

function cont() {
    $('eventModal').style.display = 'none';
    if (S.cur && S.cur.id === 'final') return endLife('natural');
    const years = S.age < 18 ? 1 + (Math.random() < 0.5 ? 1 : 0) : 2 + (Math.random() < 0.5 ? 1 : 0);
    advance(years);
    renderHUD();
    const st = stageName(S.age);
    if (st !== S.lastStage) {
        S.lastStage = st;
        toast(`✨ ${S.age} 岁 · 进入「${st}」`);
    }
    setTimeout(runTurn, 900);
}

/* ================= 人物 / 碎片 ================= */

function openPeople(ending) {
    peopleMode = !!ending;
    $('summary').style.display = 'none';
    $('peopleTitle').textContent = ending ? 'Who makes your world meaningful?' : 'People in My World';
    $('peopleSub').textContent = ending ? '选择一个你想留下的人' : '这些人，组成了你的世界。';
    $('peopleClose').style.display = ending ? 'none' : 'inline-block';

    $('peopleList').innerHTML = Object.keys(BOND).map(k => {
        const met = S.met.has(k);
        const can = ending && met;
        return `<div class="person ${met ? '' : 'lock'} ${can ? 'can' : ''}" ${can ? `onclick="choosePerson('${k}')"` : ''}>
            <span class="em">${met ? BOND[k][1] : '🔒'}</span>${BOND[k][0]}
            <div class="bar"><i style="width:${met ? S.b[k] : 0}%"></i></div>
            <div style="font-size:12px;color:#8fa0c8;margin-top:6px">${met ? Math.round(S.b[k]) : '尚未遇见'}</div></div>`;
    }).join('');
    $('peopleScreen').style.display = 'block';
}
function closePeople() { $('peopleScreen').style.display = 'none'; }

function openFrags() {
    const list = S.frags.slice().sort((a, b) => a.age - b.age);
    $('fragList').innerHTML = list.length
        ? list.map(f => `<div class="fr"><b>${f.age} 岁 · ${PLACES[f.place].icon} ${esc(f.title)}</b><br>${esc(f.choice)}<br><span style="color:#8fa0c8">${esc(f.res)}</span></div>`).join('')
        : '<div class="fr dim">还没有碎片，你的故事才刚刚开始。</div>';
    $('fragScreen').style.display = 'block';
}

/* ================= 结局 ================= */

function lifeTitle() {
    const known = Object.keys(BOND).filter(k => S.met.has(k));
    const avg = known.reduce((a, k) => a + S.b[k], 0) / known.length;
    const cands = [
        [S.h - 35, '一路走得很稳的人'],
        [S.j - 88, '把日子过成歌的人'],
        [S.w - 88, '一生好奇的人'],
        [S.m - 35, '丰足安稳的人'],
        [avg - 60, '被许多人惦记的人']
    ];

    cands.sort((a, b) => b[0] - a[0]);
    return cands[0][1];
}

function endLife(reason) {
    $('eventModal').style.display = 'none';
    renderHUD();
    $('sumAvatar').innerHTML = avatarSVG(S.o, S.age, S.j);
    $('sumName').textContent = `${S.name} · ${S.age} 岁`;
    $('sumTitle').textContent = '「' + lifeTitle() + '」';
    $('sumDesc').textContent = reason === 'health'
        ? `${S.name}在${S.age}岁那年，身体先一步停下了脚步。但沿途留下的碎片，依然闪着光。`
        : `${S.name}在${S.age}岁，在平静中走完了这一生。一路上，共留下了 ${S.frags.length} 块人生碎片。`;
    $('sumChips').innerHTML =
        Object.keys(STAT).map(k => `<span class="chip frag">${STAT[k][1]}${STAT[k][0]} ${Math.round(S[k])}</span>`).join('') +
        Object.keys(BOND).filter(k => S.met.has(k)).map(k => `<span class="chip up">${BOND[k][1]}${BOND[k][0]} ${Math.round(S.b[k])}</span>`).join('');
    $('summary').style.display = 'block';
}

function choosePerson(k) {
    switchToSad();
    $('peopleScreen').style.display = 'none';
    setTimeout(() => {
        $('ending').innerHTML = `
            <p class="fade" style="animation-delay:0.2s">We thought we were building a world.</p>
            <h1 class="fade" style="animation-delay:2.4s">But a world is not made of places.</h1>
            <p class="fade" style="animation-delay:4.8s">It is made of the people who were there with us.</p>
            <p class="fade" style="animation-delay:7.2s">${esc(S.name)}，你把所有的碎片，最后留给了「${BOND[k][0]}」。<br>${BOND_LINE[k]}</p>
            <h1 class="fade" style="animation-delay:9.8s">比起关心天下事，<br>更好在于留下眼前人。</h1>
            <button class="fade" style="animation-delay:12.5s;margin-top:20px" onclick="restart()">再活一次</button>
            <p class="fade" style="animation-delay:14s;margin-top:36px;font-size:12px;line-height:1.9;letter-spacing:.12em;color:rgba(255,255,255,.45)">
                作者：丁墨涵 2630034021
            </p>`;
        $('ending').style.display = 'flex';
    }, 800);
}

function restart() {
    switchToMain();
    $('ending').style.display = 'none';
    $('summary').style.display = 'none';
    $('peopleScreen').style.display = 'none';
    $('fragScreen').style.display = 'none';
    $('worldScreen').style.display = 'none';
    $('createScreen').style.display = 'block';
    S = null;
    buildCreate();
}
</script>
</body>
</html>
