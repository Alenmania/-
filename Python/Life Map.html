<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeWorld｜人生地图</title>

<style>
@property --s1 { syntax: '<color>'; inherits: true; initial-value: #3a4a8c; }
@property --s2 { syntax: '<color>'; inherits: true; initial-value: #c9779b; }
@property --s3 { syntax: '<color>'; inherits: true; initial-value: #ffc79a; }
@property --m1 { syntax: '<color>'; inherits: true; initial-value: #5d5a94; }
@property --m2 { syntax: '<color>'; inherits: true; initial-value: #4a6b9a; }
@property --g1 { syntax: '<color>'; inherits: true; initial-value: #4aa57a; }
@property --g2 { syntax: '<color>'; inherits: true; initial-value: #25705f; }
@property --leaf { syntax: '<color>'; inherits: true; initial-value: #6fcf8f; }
@property --leaf2 { syntax: '<color>'; inherits: true; initial-value: #ffb3c8; }
@property --water { syntax: '<color>'; inherits: true; initial-value: #6aa8d8; }
@property --cloud { syntax: '<color>'; inherits: true; initial-value: #ffffff; }

* { box-sizing: border-box; }
:root { --glass: rgba(12,18,32,.84); --line: rgba(255,255,255,.16); --gold: #ffd166; --mut: #9fb0d0; }
html, body { height: 100%; }
body {
    margin: 0; background: #080b12; color: #fff; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}
button {
    border: none; padding: 12px 24px; border-radius: 30px; background: #fff; color: #111;
    font-size: 16px; cursor: pointer; transition: .25s; font-family: inherit;
}
button:hover { transform: scale(1.05); }
button.ghost { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.25); padding: 9px 16px; font-size: 14px; }
button.ghost:hover { background: rgba(255,255,255,.2); }
button.big {
    font-size: 19px; padding: 15px 38px; font-weight: bold; color: #2a1a05;
    background: linear-gradient(135deg, #ffe29a, #ffb86b 55%, #ff9a8b);
    box-shadow: 0 0 0 0 rgba(255,200,120,.6), 0 8px 30px rgba(255,160,90,.35);
    animation: pulseBtn 2.6s infinite;
}
@keyframes pulseBtn { 0%{box-shadow:0 0 0 0 rgba(255,200,120,.5),0 8px 30px rgba(255,160,90,.35)} 70%{box-shadow:0 0 0 16px rgba(255,200,120,0),0 8px 30px rgba(255,160,90,.35)} 100%{box-shadow:0 0 0 0 rgba(255,200,120,0),0 8px 30px rgba(255,160,90,.35)} }

.screen { position: absolute; inset: 0; }
svg { overflow: visible; }

/* ================= 首页 ================= */
#startScreen {
    display: flex; flex-direction: column; align-items: center; overflow: hidden;
    background: linear-gradient(180deg, #080c26 0%, #1d2a5a 42%, #5a4678 72%, #d98a73 100%);
}
#tStars { position: absolute; inset: 0; width: 100%; height: 100%; }
.tCloud { position: absolute; color: rgba(255,255,255,.16); animation: drift linear infinite; z-index: 1; }
.tTitle { position: relative; z-index: 4; margin-top: 6vh; text-align: center; padding: 0 16px; }
.tTitle h1 {
    margin: 0; font-size: clamp(46px, 8.5vw, 88px); letter-spacing: .12em;
    background: linear-gradient(90deg, #fff, #ffd9a0, #ffb3d1, #b9d4ff, #fff); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 7s linear infinite; filter: drop-shadow(0 4px 18px rgba(255,190,150,.35));
}
@keyframes shine { to { background-position: 250% 0; } }
.tTitle .subtitle { color: #c6cfe8; font-size: clamp(14px, 2vw, 20px); margin-top: 8px; letter-spacing: .08em; }
#tMap { position: absolute; left: 3%; right: 3%; top: 25vh; height: 42vh; z-index: 3; }
#tMap svg.tLine { position: absolute; inset: 0; width: 100%; height: 100%; }
.tPlace {
    position: absolute; transform: translate(-50%, -86%); text-align: center; cursor: pointer;
    width: var(--tw);
}
.tPlace .art { animation: idle 4s ease-in-out infinite; }
.tPlace .art { width: 100%; aspect-ratio: 1; filter: drop-shadow(0 8px 12px rgba(0,0,0,.45)); transition: .3s; }
.tPlace:hover .art { transform: scale(1.14) translateY(-6px); }
.tPlace .art svg { width: 100%; height: 100%; display: block; }
.tPlace .lab {
    margin: -2px auto 0; display: inline-block; padding: 3px 12px; border-radius: 12px;
    background: rgba(10,16,34,.72); border: 1px solid rgba(255,255,255,.2);
    font-size: 13px; white-space: nowrap;
}
.tPlace .lab i { display: block; font-style: normal; font-size: 9px; letter-spacing: .2em; color: #9fb0d0; }
.tHills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34vh; z-index: 2; pointer-events: none; }
.menu { position: absolute; left: 0; right: 0; bottom: 5vh; z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.menuRow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
#tFoot { color: rgba(255,255,255,.55); font-size: 12px; letter-spacing: .1em; }

/* ================= 创建角色 ================= */
#createScreen {
    display: none; overflow-y: auto; padding: 30px 20px 50px;
    background: radial-gradient(circle at 20% 10%, #24356a 0%, #0d1220 52%, #080b12 92%);
}
.createWrap { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; }
.previewBox { width: 290px; text-align: center; }
.previewBox .stage {
    position: relative; height: 340px; border-radius: 26px; overflow: hidden;
    background: radial-gradient(circle at 50% 70%, #3b4f88 0%, #16203a 72%);
    border: 1px solid rgba(255,255,255,.14); display: flex; align-items: flex-end; justify-content: center;
}
.previewBox .stage::before {
    content: ""; position: absolute; inset: -40%; opacity: .5;
    background: conic-gradient(from 0deg, transparent 0 10%, rgba(255,255,255,.08) 12%, transparent 16% 30%, rgba(255,209,102,.1) 32%, transparent 36% 60%, rgba(255,255,255,.08) 62%, transparent 66%);
    animation: spin 24s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#preview { position: relative; z-index: 2; height: 300px; margin-bottom: 14px; animation: idle 3.4s ease-in-out infinite; }
#preview svg { height: 100%; width: auto; }
.pedestal { position: absolute; bottom: 10px; left: 50%; width: 170px; height: 28px; margin-left: -85px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,209,102,.5), rgba(255,209,102,0) 70%); z-index: 1; }
.ageRow { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: #aab4c8; }
.ageRow input { flex: 1; accent-color: #ffd166; }
.ageRow b { min-width: 86px; color: #ffd166; font-weight: normal; }
.previewBox input[type=text] {
    margin-top: 12px; width: 100%; padding: 12px 16px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08);
    color: #fff; font-size: 16px; text-align: center; font-family: inherit;
}
.startStats { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); text-align: left; }
.startStats .cap { font-size: 12px; color: #8fa0c8; margin-bottom: 8px; }
.mini { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
.mini .bar { flex: 1; margin: 0; }
.mini b { width: 24px; text-align: right; font-weight: normal; color: #cfd8ee; }
.formBox { flex: 1; min-width: 300px; max-width: 640px; }
.formBox h2 { margin: 0 0 6px; }
.formBox h3 { margin: 22px 0 10px; font-size: 15px; color: #aab4c8; font-weight: normal; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); cursor: pointer; transition: .2s; }
.sw:hover { transform: scale(1.14); }
.sw.sel, .opt.sel { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
.opt { padding: 10px 16px; border-radius: 14px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.12); cursor: pointer; font-size: 14px; transition: .2s; }
.opt:hover { background: rgba(255,255,255,.14); }
.opt small { display: block; color: #9aa4b8; margin-top: 4px; font-size: 12px; }
.cards .opt { width: calc(50% - 5px); }
.createBtn { margin-top: 30px; width: 100%; font-size: 18px; padding: 15px; }

/* ================= 世界 ================= */
#worldScreen {
    display: none; flex-direction: column;
    transition: --s1 2.6s, --s2 2.6s, --s3 2.6s, --m1 2.6s, --m2 2.6s, --g1 2.6s, --g2 2.6s, --leaf 2.6s, --leaf2 2.6s, --water 2.6s, --cloud 2.6s;
}
.hud {
    display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding: 8px 18px;
    background: linear-gradient(180deg, rgba(14,20,34,.97), rgba(14,20,34,.88));
    border-bottom: 1px solid var(--line); z-index: 12; position: relative;
}
.portrait { position: relative; width: 64px; height: 64px; flex: none; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #4a5f9c, #1a2442); border: 2px solid rgba(255,209,102,.7); box-shadow: 0 0 14px rgba(255,209,102,.35); overflow: hidden; }
#hudAvatar { position: absolute; left: 50%; top: 8px; width: 56px; height: 72px; transform: translateX(-50%); }
#hudAvatar svg, #tokenAv svg { width: 100%; height: 100%; display: block; }
.hudInfo { min-width: 112px; }
#hudName { font-size: 18px; font-weight: bold; }
#hudAge { font-size: 13px; color: #c4cce0; margin-top: 2px; }
#hudStage { display: inline-block; margin-top: 3px; font-size: 11px; padding: 2px 9px; border-radius: 10px; background: rgba(255,209,102,.18); color: #ffd166; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; flex: 1; }
.stat { width: 128px; font-size: 12px; color: #c4cce0; position: relative; }
.stat .sTop { display: flex; justify-content: space-between; }
.stat b { font-weight: bold; color: #fff; }
.bar { height: 9px; background: #1c2538; border-radius: 6px; overflow: hidden; margin-top: 4px; box-shadow: inset 0 1px 3px rgba(0,0,0,.5); }
.bar i { display: block; height: 100%; border-radius: 6px; transition: width .7s; position: relative; }
.bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.35), transparent 55%); }
.stat.pulse .sTop b { animation: numPulse .8s; }
@keyframes numPulse { 30% { transform: scale(1.6); color: #ffd166; } }
.hudBtns { display: flex; gap: 10px; align-items: center; }
.wishCnt { padding: 6px 12px; border-radius: 16px; background: rgba(255,209,102,.14); border: 1px solid rgba(255,209,102,.35); color: #ffd166; font-size: 13px; }
.float { position: fixed; z-index: 400; pointer-events: none; font-weight: bold; font-size: 16px; text-shadow: 0 2px 6px #000; animation: floatUp 1.5s ease-out forwards; }
.float.up { color: #8be8a8; } .float.down { color: #ff9d9d; }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -46px); } }

#world {
    flex: 1; position: relative; overflow: hidden; --pw: 120px;
    background: linear-gradient(180deg, var(--s1) 0%, var(--s2) 45%, var(--s3) 100%);
}
#world > * { position: absolute; }
#stars, #fx { left: 0; top: 0; pointer-events: none; }
#stars { z-index: 1; } #fx { z-index: 6; }
#sun { z-index: 1; left: 0; top: 0; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; transition: transform 2.4s ease, box-shadow 2.4s; will-change: transform; }
#clouds { inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.cloud { position: absolute; color: var(--cloud); opacity: .72; animation: drift linear infinite; }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
#land { left: 0; top: 0; width: 100%; height: 100%; z-index: 2; }

@keyframes flow { to { stroke-dashoffset: -21; } }
#land .lit { opacity: 0; transition: opacity 1.4s; }
#land .lit.on { opacity: .9; }

@keyframes rip { 50% { transform: scale(1.18); opacity: .35; } }
#land .lf { fill: var(--leaf); } #land .lf2 { fill: var(--leaf2); }

@keyframes sway { 50% { transform: rotate(2.4deg); } }
#placesLayer { inset: 0; z-index: 3; }
#tint { inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, rgba(10,16,60,.25), rgba(4,6,30,.85)); opacity: 0; transition: opacity 2.4s; }

.place { position: absolute; left: 0; top: 0; width: 0; height: 0; cursor: pointer; }
.place .ground { position: absolute; left: calc(var(--pw) * -.46); top: -8px; width: calc(var(--pw) * .92); height: 22px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.35), transparent 70%); }
.place.active .ground { background: radial-gradient(ellipse, rgba(255,209,102,.85), rgba(255,209,102,0) 70%); animation: ring 1.8s ease-in-out infinite; }
@keyframes ring { 50% { transform: scale(1.25); opacity: .6; } }
.place .art { position: absolute; width: var(--pw); height: var(--pw); left: calc(var(--pw) / -2); top: calc(var(--pw) * -.9); transition: transform .3s, filter .6s, opacity .6s; }
.place .art svg { width: 100%; height: 100%; display: block; animation: idle 4.2s ease-in-out infinite; }
.place:hover .art { transform: scale(1.1) translateY(-4px); }
.place .lab {
    position: absolute; top: 16px; left: 0; transform: translateX(-50%); white-space: nowrap; text-align: center;
    padding: 3px 12px 4px; border-radius: 12px; background: rgba(10,16,34,.78); border: 1px solid rgba(255,255,255,.22);
    font-size: 13px; line-height: 1.25; pointer-events: none; transition: .3s;
}
.place .lab i { display: block; font-style: normal; font-size: 9px; letter-spacing: .22em; color: #9fb0d0; }
.place.active .lab { background: rgba(255,209,102,.92); color: #2a1a05; border-color: #fff; }
.place.active .lab i { color: #6b4a1a; }
.place.fog .art { filter: grayscale(1) brightness(.45) blur(.6px); opacity: .6; }
.place.fog .lab { opacity: .7; }
.place.pop .art { animation: popIn 1s; }
@keyframes popIn { 0% { transform: scale(.2) translateY(30px); opacity: 0; } 55% { transform: scale(1.3); } 100% { transform: scale(1); opacity: 1; } }
.badge {
    position: absolute; top: calc(var(--pw) * -.9); left: calc(var(--pw) * .28); min-width: 22px; height: 22px; border-radius: 11px;
    background: #ffd166; color: #222; font-size: 12px; font-weight: bold; display: none; align-items: center; justify-content: center; padding: 0 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
@keyframes idle { 50% { transform: translateY(-3px); } }

#token { left: 0; top: 0; width: 50px; height: 64px; margin: -56px 0 0 -25px; z-index: 5; cursor: pointer; will-change: transform; transform-style: preserve-3d; }
#token .tk { width: 100%; height: 100%; }
#token.walking .tk { animation: bob .34s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(3deg); } }
.bubble {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) scale(.8); margin-bottom: 4px; padding: 7px 12px; border-radius: 14px;
    background: #fff; color: #222; font-size: 13px; white-space: nowrap; opacity: 0; pointer-events: none; transition: .25s;
}
.bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top-color: #fff; }
.bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }

#wishLayer { inset: 0; z-index: 8; pointer-events: none; }
.wish { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; font-size: 30px; line-height: 40px; text-align: center; pointer-events: auto; cursor: pointer; transition: top 4s ease-out, opacity .8s; filter: drop-shadow(0 0 10px #ffd166); }
.wish span { display: block; animation: wishIdle 1.6s ease-in-out infinite; }
@keyframes wishIdle { 50% { transform: translateY(-6px) scale(1.18) rotate(12deg); } }
.wish.gone { opacity: 0; transform: scale(.4); }
.wishPop { position: absolute; z-index: 9; transform: translateX(-50%); padding: 6px 14px; border-radius: 14px; background: rgba(255,209,102,.95); color: #3a2800; font-size: 14px; white-space: nowrap; animation: floatUp2 2.6s ease-out forwards; pointer-events: none; }
@keyframes floatUp2 { 0% { opacity: 0; transform: translate(-50%, 8px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }
.spark { position: absolute; z-index: 9; width: 6px; height: 6px; border-radius: 50%; background: #ffd166; pointer-events: none; box-shadow: 0 0 8px #ffd166; animation: spark .8s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

#dock { left: 14px; bottom: 64px; z-index: 30; display: flex; flex-direction: column; gap: 10px; }
.dockBtn {
    position: relative; width: 46px; height: 46px; padding: 0; border-radius: 16px; font-size: 21px;
    background: var(--glass); color: #fff; border: 1px solid var(--line); 
}
.dockBtn:hover { background: rgba(60,80,130,.9); transform: translateX(4px) scale(1.06); }
.dockBtn::after {
    content: attr(data-tip); position: absolute; left: 56px; top: 50%; transform: translateY(-50%); white-space: nowrap;
    padding: 4px 10px; border-radius: 10px; background: rgba(0,0,0,.8); font-size: 12px; opacity: 0; pointer-events: none; transition: .2s;
}
.dockBtn:hover::after { opacity: 1; }

#timeline { left: 0; right: 0; bottom: 0; height: 54px; z-index: 9; padding: 0 28px; background: linear-gradient(0deg, rgba(8,12,22,.92), rgba(8,12,22,.55) 70%, transparent); display: flex; align-items: center; }
#tlTrack { position: relative; width: 100%; height: 6px; border-radius: 4px; background: rgba(255,255,255,.18); margin-top: 6px; }
#tlFill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #6cb4ff, #ffd166, #ff9a8b); transition: width .9s; }
#tlTicks span { position: absolute; top: 12px; transform: translateX(-50%); font-size: 10px; color: #7c8aa8; }
#tlTicks span::before { content: ""; position: absolute; left: 50%; top: -9px; width: 1px; height: 5px; background: rgba(255,255,255,.3); }
#tlPin { position: absolute; top: -26px; transform: translateX(-50%); padding: 2px 8px; border-radius: 10px; background: #ffd166; color: #2a1a05; font-size: 11px; font-weight: bold; transition: left .9s; }
#tlPin::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -4px; border: 4px solid transparent; border-top-color: #ffd166; }
.mk { position: absolute; top: -2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border: 1.5px solid #fff; cursor: pointer; transition: transform .2s; animation: popIn2 .5s; }
.mk:hover { transform: scale(1.7); z-index: 3; }
.mk::after { content: attr(data-tip); position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 3px 9px; border-radius: 9px; background: rgba(0,0,0,.85); font-size: 11px; opacity: 0; pointer-events: none; transition: .2s; }
.mk:hover::after { opacity: 1; }
@keyframes popIn2 { from { transform: scale(0); } }

#infoPanel {
    display: none; right: 16px; bottom: 64px; z-index: 10; width: 350px; max-height: 66%; overflow-y: auto; padding: 18px;
    border-radius: 20px; background: var(--glass); border: 1px solid var(--line);  animation: pop .3s;
}
#infoPanel .pArt { width: 96px; height: 96px; float: left; margin: -4px 12px 4px -4px; }
#infoPanel h2 { margin: 2px 0 4px; font-size: 20px; }
#infoPanel .lv { color: #ffd166; letter-spacing: 2px; font-size: 13px; }
.close { position: absolute; right: 14px; top: 10px; cursor: pointer; color: #aaa; font-size: 18px; }
.fr { padding: 8px 0; border-top: 1px solid rgba(255,255,255,.08); font-size: 13px; line-height: 1.6; color: #cdd5e6; clear: both; cursor: pointer; text-align: left; }
.fr:hover { color: #fff; }
.fr.dim { color: #7c8696; cursor: default; }
.fr b { color: #ffd166; }

#ageTicker { display: none; inset: 0; z-index: 14; align-items: center; justify-content: center; flex-direction: column; pointer-events: none; background: radial-gradient(circle, rgba(0,0,0,.5), transparent 65%); animation: fadeIn .4s; }
#ageTicker.out { opacity: 0; transition: opacity .35s; }
#ageTicker .num { font-size: 84px; font-weight: bold; text-shadow: 0 4px 24px rgba(255,209,102,.7); }
#ageTicker small { letter-spacing: .5em; color: #ffd9a0; }
#stageBanner { display: none; left: 0; right: 0; top: 30%; z-index: 15; text-align: center; pointer-events: none; padding: 16px 0; background: linear-gradient(90deg, transparent, rgba(8,12,30,.85) 20%, rgba(8,12,30,.85) 80%, transparent); animation: stageIn 2.6s forwards; }
#stageBanner small { display: block; letter-spacing: .5em; color: #9fb0d0; font-size: 12px; }
#stageBanner b { font-size: 34px; letter-spacing: .2em; color: #ffd166; }
@keyframes stageIn { 0% { opacity: 0; transform: scaleY(.2); } 12%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* 事件弹窗 */
#eventModal { display: none; position: absolute; inset: 0; z-index: 20; background: rgba(5,8,15,.78); align-items: center; justify-content: center; padding: 14px; }
.card { background: rgba(18,24,38,.985); border: 1px solid rgba(255,255,255,.16); border-radius: 22px; animation: pop .35s; }
.card.ev { width: min(740px, 100%); max-height: 96%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,.6); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
#evBanner { position: relative; height: clamp(120px, 24vh, 180px); flex: none; overflow: hidden; background: linear-gradient(180deg, var(--s1), var(--s2) 55%, var(--s3)); }
#evBanner > div { position: absolute; }
.bHill { left: -10%; width: 120%; bottom: 24%; height: 60%; border-radius: 50% 50% 0 0; background: var(--m2); }
.bGround { left: 0; right: 0; bottom: 0; height: 32%; background: linear-gradient(180deg, var(--g1), var(--g2)); }
.bArt { right: 7%; bottom: 10%; height: 90%; aspect-ratio: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
.bArt svg, .bAv svg { width: 100%; height: 100%; display: block; }
.bAv { right: 30%; bottom: 7%; height: 74%; aspect-ratio: 200/258; animation: idle 3s ease-in-out infinite; }
.bSpark i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px #fff; animation: tw 2.4s ease-in-out infinite; }
.bSpark i:nth-child(1) { left: 12%; top: 22%; } .bSpark i:nth-child(2) { left: 34%; top: 14%; animation-delay: .5s; } .bSpark i:nth-child(3) { left: 58%; top: 28%; animation-delay: 1s; } .bSpark i:nth-child(4) { left: 78%; top: 12%; animation-delay: 1.5s; } .bSpark i:nth-child(5) { left: 90%; top: 34%; animation-delay: .8s; }
@keyframes tw { 50% { opacity: .15; transform: scale(.4); } }
.bTitle { left: 0; right: 0; bottom: 0; padding: 30px 24px 12px; background: linear-gradient(0deg, rgba(8,12,24,.88), transparent); }
.bTitle small { color: #cdd8f0; font-size: 12px; letter-spacing: .08em; }
.bTitle h2 { margin: 2px 0 0; font-size: 26px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.evBody { padding: 16px 26px 22px; overflow-y: auto; }
.card p.txt { color: #d9deec; line-height: 1.85; margin: 0 0 12px; min-height: 3.6em; font-size: 16px; }
.hint { color: #6f7d9c; font-size: 12px; margin-top: 4px; }
.choice {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin: 9px 0; border-radius: 14px;
    background: rgba(255,255,255,.07); color: #fff; border: 1px solid rgba(255,255,255,.17); padding: 13px 16px; line-height: 1.5; font-size: 15px;
    animation: slideIn .45s both;
}
.choice .key { flex: none; width: 24px; height: 24px; border-radius: 7px; background: rgba(255,255,255,.14); display: grid; place-items: center; font-size: 12px; color: #cfd8ee; }
.choice:hover { background: linear-gradient(90deg, rgba(255,209,102,.24), rgba(255,255,255,.08)); border-color: #ffd166; transform: translateX(6px); }
.choice:hover .key { background: #ffd166; color: #2a1a05; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
.chip { display: inline-block; padding: 4px 11px; border-radius: 12px; font-size: 13px; margin: 6px 6px 0 0; animation: chipIn .5s both; }
.chip.up { background: rgba(80,200,120,.2); color: #8be8a8; }
.chip.down { background: rgba(255,100,100,.2); color: #ff9d9d; }
.chip.frag { background: rgba(255,209,102,.2); color: #ffd166; }
@keyframes chipIn { from { opacity: 0; transform: scale(.5) translateY(8px); } to { opacity: 1; transform: none; } }
.resChoice { color: #8fa0c8; font-size: 14px; }
#resText { font-size: 18px; line-height: 1.85; margin: 10px 0 8px; min-height: 3.4em; }
.getFrag { display: flex; gap: 14px; align-items: center; margin-top: 14px; padding: 10px 14px; border-radius: 16px; border: 1px solid var(--rc); background: linear-gradient(120deg, color-mix(in srgb, var(--rc) 20%, transparent), rgba(255,255,255,.03)); animation: fragDrop .9s .25s both; position: relative; overflow: hidden; }
.getFrag.r2::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); animation: sheen 2.2s 1s infinite; }
@keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@keyframes fragDrop { 0% { opacity: 0; transform: translateY(-40px) rotate(-6deg) scale(.6); } 60% { transform: translateY(6px) rotate(2deg) scale(1.04); } 100% { opacity: 1; transform: none; } }
.getFrag .gfArt { width: 52px; height: 52px; flex: none; }
.getFrag .gfArt svg { width: 100%; height: 100%; }
.getFrag b { color: var(--rc); }
.getFrag small { color: #aab4c8; }
.newBond { margin-top: 12px; padding: 10px 14px; border-radius: 14px; background: linear-gradient(90deg, rgba(255,143,168,.3), rgba(255,143,168,.05)); border: 1px solid rgba(255,143,168,.5); animation: slideIn .6s .4s both; }

/* 覆盖层 */
.overlay { display: none; position: fixed; inset: 0; z-index: 60; background: radial-gradient(circle at 50% 0%, rgba(32,46,86,.975), rgba(5,8,15,.99) 72%); padding: 46px 24px 70px; overflow-y: auto; text-align: center; animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.overlay .x { position: fixed; top: 14px; right: 18px; width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 18px; background: rgba(255,255,255,.12); color: #fff; z-index: 3; }
.ovTitle { margin: 0 0 6px; font-size: 30px; }
.ovSub { color: #9aa4b8; margin: 0 0 18px; }
#peopleScreen { z-index: 70; } #fragScreen { z-index: 70; } #detailScreen { z-index: 80; } #achScreen { z-index: 90; } #setScreen { z-index: 95; } #helpScreen { z-index: 96; }
#summary { z-index: 65; background: radial-gradient(circle at center, #1d2a4a 0%, #080b12 70%); }

.people { display: flex; justify-content: center; gap: 22px; margin-top: 30px; flex-wrap: wrap; }
.person { width: 158px; padding: 18px 8px; border-radius: 24px; background: #1b2538; transition: .3s; font-size: 14px; border: 1px solid rgba(255,255,255,.08); }
.person .em { font-size: 40px; display: block; margin-bottom: 6px; }
.person.can { cursor: pointer; }
.person.can:hover { transform: translateY(-6px) scale(1.06); background: #35466b; border-color: #ffd166; }
.person.lock { opacity: .35; }
.hearts { margin-top: 8px; font-size: 15px; letter-spacing: 2px; color: #ff8fa8; }
.hearts .e { color: #3a4560; }
.lvl { font-size: 12px; color: #8fa0c8; margin-top: 4px; }
#personDetail { max-width: 600px; margin: 26px auto 0; padding: 18px 22px; border-radius: 20px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); text-align: left; display: none; animation: pop .3s; }
#personDetail h3 { margin: 0 0 6px; }

.filters { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.fchip { padding: 6px 14px; border-radius: 16px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); cursor: pointer; font-size: 13px; }
.fchip.sel { background: #ffd166; color: #2a1a05; border-color: #ffd166; }
.wall { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; max-width: 980px; margin: 0 auto; }
.polaroid { width: 190px; height: 250px; perspective: 800px; cursor: pointer; transform: rotate(var(--rot)); transition: transform .3s; }
.polaroid:hover { transform: rotate(0) translateY(-6px) scale(1.04); z-index: 2; }
.polaroid .inner { position: relative; width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d; }
.polaroid.flip .inner { transform: rotateY(180deg); }
.pf { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px; padding: 10px 10px 12px; background: #f4efe4; color: #2b2b33; box-shadow: 0 8px 22px rgba(0,0,0,.5); text-align: left; border-bottom: 5px solid var(--rc); }
.pf.back { transform: rotateY(180deg); background: #2a3350; color: #e6ebf8; overflow-y: auto; font-size: 13px; line-height: 1.7; }
.pimg { height: 150px; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; background: linear-gradient(180deg, #7aa5ff, #b8d4ff 60%, #7dc59a 61%); }
.pimg svg { height: 92%; width: auto; }
.pcap { margin-top: 8px; font-size: 13px; line-height: 1.4; }
.pcap small { color: #7a7a86; display: block; }
.pf .rar { position: absolute; right: 8px; top: 8px; font-size: 11px; padding: 2px 8px; border-radius: 9px; background: var(--rc); color: #111; font-weight: bold; }
.fragList { max-width: 640px; margin: 24px auto 0; text-align: left; }

.achGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; max-width: 980px; margin: 18px auto 0; text-align: left; }
.achCard { display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
.achCard .ic { font-size: 30px; width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.08); display: grid; place-items: center; flex: none; }
.achCard small { display: block; color: #8c97ad; margin-top: 3px; line-height: 1.5; }
.achCard.on { background: linear-gradient(120deg, rgba(255,209,102,.18), rgba(255,255,255,.04)); border-color: rgba(255,209,102,.55); }
.achCard.on .ic { background: rgba(255,209,102,.25); }
.achCard.off { opacity: .55; } .achCard.off .ic { filter: grayscale(1); }
#achStack { position: fixed; top: 80px; right: 16px; z-index: 500; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.achPop { display: flex; gap: 12px; align-items: center; padding: 12px 18px; border-radius: 16px; background: linear-gradient(120deg, #ffe29a, #ffb86b); color: #2a1a05; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: achIn .5s both, achOut .5s 3.6s forwards; }
.achPop .ic { font-size: 28px; } .achPop small { display: block; opacity: .75; }
@keyframes achIn { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: none; } }
@keyframes achOut { to { opacity: 0; transform: translateX(80px); } }

.setBox { max-width: 520px; margin: 24px auto 0; text-align: left; }
.setRow { display: flex; align-items: center; gap: 14px; padding: 16px 4px; border-bottom: 1px solid rgba(255,255,255,.1); }
.setRow label { width: 120px; flex: none; }
.setRow input[type=range] { flex: 1; accent-color: #ffd166; }
.seg { display: flex; gap: 6px; flex: 1; }
.seg button { flex: 1; padding: 8px 4px; font-size: 13px; background: rgba(255,255,255,.08); color: #fff; border-radius: 12px; }
.seg button.sel { background: #ffd166; color: #2a1a05; }
.tog { width: 56px; height: 30px; padding: 0; border-radius: 15px; background: #3a4560; position: relative; }
.tog::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .25s; }
.tog.on { background: #5ee0a0; } .tog.on::after { left: 29px; }

.helpCard { max-width: 520px; margin: 40px auto 0; padding: 30px 28px; border-radius: 24px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); min-height: 250px; animation: pop .3s; }
.helpCard .ic { font-size: 56px; } .helpCard h2 { margin: 10px 0; } .helpCard p { color: #c4cce0; line-height: 1.9; }
.dots { margin: 20px 0; } .dots i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); margin: 0 4px; } .dots i.on { background: #ffd166; width: 22px; border-radius: 4px; }

#detailBody { max-width: 520px; margin: 30px auto 0; padding: 26px; border-radius: 24px; background: rgba(255,255,255,.06); border: 1px solid var(--rc, rgba(255,255,255,.2)); text-align: center; animation: pop .3s; }
#detailBody .dArt { width: 130px; height: 130px; margin: 0 auto; } #detailBody .dArt svg { width: 100%; height: 100%; }

#summary .av { width: 130px; height: 160px; margin: 6px auto; }
#summary .av svg { width: 100%; height: 100%; }
#summary h1 { margin: 6px 0; font-size: 34px; }
#summary .lt { color: #ffd166; font-size: 22px; margin: 4px 0 12px; }
#summary .sd { color: #aab4c8; line-height: 1.8; max-width: 560px; margin: 0 auto 10px; }
.sumRow { display: flex; justify-content: center; flex-wrap: wrap; gap: 24px; align-items: center; margin: 8px 0; }

#ending { display: none; position: fixed; inset: 0; z-index: 120; background: #05070c; overflow-y: auto; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px; }
#ending h1 { font-size: 42px; max-width: 800px; line-height: 1.5; margin: 14px 0; }
#ending p { color: #9299a8; font-size: 18px; line-height: 1.8; max-width: 640px; }
.fade { opacity: 0; animation: fadeIn 2s forwards; }

#toast { position: fixed; top: 92px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.95); color: #111; padding: 10px 22px; border-radius: 24px; z-index: 300; display: none; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: 90vw; text-align: center; }

@media (max-width: 700px) {
    #world { --pw: 84px; }
    .place .lab { font-size: 11px; padding: 2px 8px; }
    .stat { width: 100px; }
    #infoPanel { right: 10px; left: 10px; width: auto; }
    #ending h1 { font-size: 30px; }
    .hud { gap: 10px; padding: 6px 12px; }
    .portrait { width: 54px; height: 54px; } #hudAvatar { width: 46px; height: 60px; }
    .dockBtn { width: 40px; height: 40px; font-size: 18px; }
    .card.ev .bTitle h2 { font-size: 21px; }
    .evBody { padding: 12px 16px 18px; }
    #tMap { top: 24vh; height: 38vh; }
    .cards .opt { width: 100%; }
}

/* SVG 插画内的小动画 */
.smoke { animation: smoke 3.2s ease-in infinite; transform-box: fill-box; }
@keyframes smoke { 0% { opacity: .9; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-12px); } }
.win { animation: winGlow 3.4s ease-in-out infinite; }
@keyframes winGlow { 50% { opacity: .7; } }
.flag { animation: flagW 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
@keyframes flagW { 50% { transform: skewY(-8deg) scaleX(.92); } }
.bal { animation: idle 3s ease-in-out infinite; }
.flame { animation: flame .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0; }
@keyframes flame { to { transform: scaleY(1.28); } }
.blink { animation: blinkA 1.4s steps(2) infinite; }
@keyframes blinkA { 50% { opacity: .1; } }
.tw { transform-box: fill-box; transform-origin: center; }
.flowT { animation: flowT 1.8s linear infinite; }
@keyframes flowT { to { stroke-dashoffset: -26; } }

/* 特殊事件（亲密度达到阈值） */
.chip.special { background: rgba(200,140,255,.3); color: #e2c4ff; border: 1px solid rgba(200,140,255,.5); }
.fr.special b { color: #d4a6ff; }
.fr.special { background: rgba(200,140,255,.06); border-radius: 8px; padding-left: 8px; padding-right: 8px; }
#toast.special { background: linear-gradient(135deg, #d4a6ff, #ffb8d4); color: #2a0a3a; box-shadow: 0 0 30px rgba(200,140,255,.6); }

/* ================= 3D 场景 ================= */
#scene { inset: 0; z-index: 2; --rx: 16deg; --ry: 0deg; transform-style: preserve-3d; transform-origin: 50% 80%;
    transform: perspective(1500px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.2); transition: transform .35s ease-out; will-change: transform; }
#scene > * { position: absolute; }
#land { left: 0; top: 0; width: 100%; height: 100%; }
#placesLayer { inset: 0; transform-style: preserve-3d; }
.place { transform-style: preserve-3d; }
.place .art { transform: rotateX(calc(var(--rx) * -1)) rotateY(calc(var(--ry) * -1)); transform-origin: 50% 100%; }
.place:hover .art { transform: rotateX(calc(var(--rx) * -1)) rotateY(calc(var(--ry) * -1)) scale(1.1) translateY(-4px); }
.place .lab { transform: translateX(-50%) translateZ(3px); }
.place .badge { transform: translateZ(8px) rotateX(calc(var(--rx) * -1)); transform-origin: 50% 100%; }
#token .tkw { width: 100%; height: 100%; transform: translateZ(10px) rotateX(calc(var(--rx) * -1)); transform-origin: 50% 100%; }
#token .bubble { transform-origin: 50% 100%; }
.bubble { transform: translateX(-50%) scale(.8); } .bubble.show { transform: translateX(-50%) scale(1); }
.paused #world * { animation-play-state: paused !important; }
/* 创建角色：3D 转台 */
#preview { perspective: 700px; }
#preview svg { transform: rotateY(var(--pry, 0deg)) rotateX(var(--prx, 0deg)); transition: transform .15s ease-out; transform-style: preserve-3d; }
/* 标题地图：3D 倾斜 */
#tMap { perspective: 1100px; }
#tMap .tPlane { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(var(--trx, 14deg)) rotateY(var(--try, 0deg)); transition: transform .3s ease-out; }
.tPlace .art { transform: rotateX(calc(var(--trx, 14deg) * -1)); transform-origin: 50% 100%; }
.tPlace:hover .art { transform: rotateX(calc(var(--trx, 14deg) * -1)) scale(1.14) translateY(-6px); }
</style>
</head>

<body>

<!-- ================= 首页 ================= -->
<div id="startScreen" class="screen">
    <canvas id="tStars"></canvas>
    <div class="tTitle">
        <h1>LifeWorld</h1>
        <div class="subtitle">把碎片拼成世界，把世界留给眼前人。</div>
    </div>
    <div id="tMap"></div>
    <svg class="tHills" viewBox="0 0 1000 200" preserveAspectRatio="none">
        <path d="M0,200 L0,90 Q120,30 260,80 T520,70 T780,60 T1000,80 L1000,200Z" fill="rgba(30,24,60,.55)"/>
        <path d="M0,200 L0,130 Q160,80 320,125 T640,110 T1000,120 L1000,200Z" fill="rgba(22,18,48,.8)"/>
        <path d="M0,200 L0,165 Q200,130 400,160 T800,150 T1000,160 L1000,200Z" fill="#0d1022"/>
    </svg>
    <div class="menu">
        <button id="startBtn" class="big" onclick="openCreate()">✨ 开始构建我的世界</button>
        <div class="menuRow">
            <button class="ghost" onclick="openOv('ach')">🏆 成就</button>
            <button class="ghost" onclick="openOv('settings')">⚙️ 设置</button>
            <button class="ghost" onclick="openHelp()">❓ 玩法</button>
        </div>
        <div id="tFoot"></div>
    </div>
</div>

<!-- ================= 创建角色 ================= -->
<div id="createScreen" class="screen">
    <div class="createWrap">
        <div class="previewBox">
            <div class="stage"><div id="preview"></div><div class="pedestal"></div></div>
            <div class="ageRow"><span>预览年龄</span><input type="range" id="ageSlider" min="1" max="85" value="24" oninput="buildCreate()"><b id="ageLabel"></b></div>
            <input type="text" id="nameInput" maxlength="12" placeholder="给你的主角起个名字">
            <button class="ghost" style="margin-top:10px;width:100%" onclick="randomize()">🎲 随机一个人生开局</button>
            <div class="startStats"><div class="cap">出生时的属性（受家庭和性格影响）</div><div id="startStats"></div></div>
        </div>
        <div class="formBox">
            <h2>塑造你的形象</h2>
            <div style="color:#8fa0c8;font-size:13px">你的样子会随着年龄慢慢改变：长大、变老，头发也会变白。拖动左边的滑块可以预览。</div>

            <h3>发型</h3><div class="row" id="hairStyles"></div>
            <h3>发色</h3><div class="row" id="hairColors"></div>
            <h3>肤色</h3><div class="row" id="skins"></div>
            <h3>衣服颜色</h3><div class="row" id="shirts"></div>
            <h3>配饰</h3><div class="row" id="glassesRow"></div>
            <h3>出生的家庭</h3><div class="row cards" id="familyList"></div>
            <h3>天生的性格</h3><div class="row cards" id="traitList"></div>

            <button id="beginBtn" class="createBtn big" onclick="beginLife()">降生到这个世界 →</button>
            <div style="text-align:center;margin-top:14px"><button class="ghost" onclick="backToTitle()">← 返回标题</button></div>
        </div>
    </div>
</div>

<!-- ================= 世界 ================= -->
<div id="worldScreen" class="screen">

    <div class="hud">
        <div class="portrait"><div id="hudAvatar"></div></div>
        <div class="hudInfo">
            <div id="hudName"></div>
            <div id="hudAge"></div>
            <span id="hudStage"></span>
        </div>
        <div class="stats" id="hudStats"></div>
        <div class="hudBtns"><div class="wishCnt" id="wishCnt" title="收集到的许愿星">⭐ 0</div></div>
    </div>

    <div id="world">
        <div id="sun"></div>
        <canvas id="stars"></canvas>
        <div id="clouds"></div>
        <div id="scene">
            <svg id="land" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="placesLayer"></div>
            <div id="token" onclick="tokenSay()"><div class="bubble" id="bubble"></div><div class="tkw"><div class="tk" id="tokenAv"></div></div></div>
        </div>
        <div id="tint"></div>
        <canvas id="fx"></canvas>
        <div id="wishLayer"></div>

        <div id="dock">
            <button class="dockBtn" data-tip="人物 (P)" onclick="openPeople(false)">👥</button>
            <button class="dockBtn" data-tip="人生碎片 (F)" onclick="openFrags()">🧩</button>
            <button class="dockBtn" data-tip="成就 (A)" onclick="openOv('ach')">🏆</button>
            <button class="dockBtn" data-tip="设置" onclick="openOv('settings')">⚙️</button>
            <button class="dockBtn" data-tip="玩法 (H)" onclick="openHelp()">❓</button>
        </div>

        <div id="timeline"><div id="tlTrack"><div id="tlFill"></div><div id="tlTicks"></div><div id="tlMarks"></div><div id="tlPin"></div></div></div>

        <div id="infoPanel">
            <span class="close" onclick="closePanel()">✕</span>
            <div class="pArt" id="placeArt"></div>
            <h2 id="placeTitle"></h2>
            <div class="lv" id="placeLevel"></div>
            <p id="placeText" style="color:#cdd5e6;line-height:1.7;clear:both;margin:10px 0 6px"></p>
            <p id="placePeople" style="color:#8fa0c8;margin:0 0 8px;font-size:13px"></p>
            <div id="placeFrags"></div>
        </div>

        <div id="ageTicker"><small>光阴流转</small><div class="num" id="tkNum"></div><small>岁</small></div>
        <div id="stageBanner"><small>NEW CHAPTER</small><b id="stageName"></b></div>

function startBGM() {

function fadeAudio(audio, to, ms, onDone) {
    const from = audio.volume, steps = 40;
    let i = 0;
    const timer = setInterval(() => {
        i++;
        audio.volume = Math.min(1, Math.max(0, from + (to - from) * i / steps));
        if (i >= steps) { clearInterval(timer); if (onDone) onDone(); }
    }, ms / steps);
}
function switchToSad() {
    fadeAudio(bgmMain, 0, 2000, () => bgmMain.pause());

}

function mix(a, b, t) {
    const pa = a.replace('#', '').match(/../g).map(x => parseInt(x, 16));
    const pb = b.replace('#', '').match(/../g).map(x => parseInt(x, 16));
    return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

    const stoop = elder ? 3 : 0;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 258">` +
        `<ellipse cx="100" cy="253" rx="${(55 * sc + 12).toFixed(1)}" ry="5" fill="rgba(0,0,0,0.35)"/>` +
        `<g transform="translate(100,250) scale(${sc.toFixed(3)}) rotate(${stoop}) translate(-100,-250)">${s}</g></svg>`;

function stageName(age) {
    if (age < 3) return '婴儿期';
    if (age < 6) return '幼年';
    if (age < 12) return '童年';
    if (age < 18) return '少年';
    if (age < 23) return '青年 · 求学';
    if (age < 35) return '青年 · 立业';
    if (age < 50) return '壮年';
    if (age < 65) return '中年';
    return '晚年';
}

let AC = null;
function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
}
function tone(f, t0, d, type, v) {
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v || .06, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);

const TW = { t: null, el: null, txt: '', i: 0, cb: null, active: false };
const SPEEDS = [55, 26, 10, 0];
function typeText(el, txt, cb) {
    clearInterval(TW.t);
    TW.el = el; TW.txt = txt; TW.i = 0; TW.cb = cb; TW.active = true;
    const sp = SPEEDS[META.set.speed];
    if (!sp) { el.textContent = txt; TW.active = false; cb && cb(); return; }
    el.textContent = '';
    TW.t = setInterval(() => {
        TW.i++; el.textContent = txt.slice(0, TW.i);
        if (TW.i >= txt.length) finishType();
    }, sp);
}
function finishType() {
    if (!TW.active) return;
    clearInterval(TW.t); TW.active = false;
    TW.el.textContent = TW.txt;
    const cb = TW.cb; TW.cb = null; cb && cb();
}
function skipType() { finishType(); }

        const d = document.createElement('span');
        d.className = 'sw' + (cfg[key] === c ? ' sel' : '');

function optRow(el, items, key, labelFn) {

        d.className = 'opt' + (cfg[key] === i ? ' sel' : '');
        d.innerHTML = labelFn(it);

        el.appendChild(d);

function newState() {

        met: new Set(['mom', 'dad', 'fri']),
        done: new Set(), frags: [], cur: null, lastStage: '',
        vis: new Set(['home']), wish: 0, busy: false, newMet: [], newAch: [], specialDone: new Set(), pendingSpecial: [], special: false
    };
}

function applyEff(str) {
    const out = [];
    (str || '').split(' ').filter(Boolean).forEach(tok => {
        const m = tok.match(/^([a-z]+)([+-]\d+)$/);
        if (!m) return;
        const k = m[1], v = +m[2];
        if (STAT[k]) {
            const before = S[k];
            let gain = v;
            if (gain > 0 && before > 50) gain = Math.max(1, Math.round(gain * (100 - before) / 50));
            S[k] = clamp(S[k] + gain);
            const d = S[k] - before;
            if (d) out.push({ key: k, kind: 's', label: STAT[k][1] + STAT[k][0], d });
        } else if (BOND[k]) {
            if (!S.met.has(k)) {
                if (S.cur && S.cur.u === k && v > 0) { S.met.add(k); (S.newMet = S.newMet || []).push(k); }
                else return;
            }
            const before = S.b[k];
            S.b[k] = Math.max(0, S.b[k] + v);
            const d = S.b[k] - before;
            if (d) out.push({ key: k, kind: 'b', label: BOND[k][1] + BOND[k][0], d });
            checkSpecial(k);
        }
    });
    return out;
}

function checkSpecial(k) {
    if (BOND_THRESHOLD[k] === undefined || S.specialDone.has(k)) return;
    if (S.b[k] >= BOND_THRESHOLD[k]) { S.specialDone.add(k); S.pendingSpecial.push(k); }
}
const bp = k => Math.min(100, S.b[k] / (BOND_MAX[k] || 100) * 100);
function lifeEnd() { return Math.round(clamp(78 + (S.h - 50) / 3, 66, 92)); }
const curP = () => S ? clamp(S.age / lifeEnd(), 0, 1) : 0;

function ridgePath(r, W, H, base, amp, step, jag) {
    const x0 = -W * .5, x1 = W * 1.5, yb = H * 1.6;
    let d = `M${x0},${yb} L${x0},${base.toFixed(1)}`;
    const p1 = r() * 6, p2 = r() * 6;
    let i = 0;
    for (let x = x0; x <= x1 + step; x += step, i++) {
        const y = jag
            ? (i % 2 ? base : base - amp * (.4 + .6 * r()))
            : base - amp * (Math.sin(x / W * 5 + p1) * .6 + Math.sin(x / W * 11 + p2) * .4);
        d += ` L${x.toFixed(0)},${y.toFixed(1)}`;
    }
    return d + ` L${x1 + step},${yb} Z`;
}

function setTokenAt(s, dir) {
    if (!MAP.full || !MAP.total) return;
    const L = MAP.total, sg = dir || 1, q = MAP.full.getPointAtLength(((s % L) + L) % L);
    MAP.tx = q.x; MAP.ty = q.y;
    $('token').style.transform = `translate(${q.x.toFixed(1)}px,${q.y.toFixed(1)}px)`;
    const q2 = MAP.full.getPointAtLength((((s + sg * 4) % L) + L) % L);
    if (Math.abs(q2.x - q.x) > .2) $('tokenAv').style.transform = q2.x < q.x ? 'scaleX(-1)' : '';
}
function moveToken(k) {
    document.querySelectorAll('.place').forEach(p => p.classList.toggle('active', p.id === 'place_' + k));
}

function moveTokenTo(k, cb) {
    const total = MAP.total;
    if (!total) { MAP.cur = k; cb && cb(); return; }
    if (MAP.anim) cancelAnimationFrame(MAP.anim);
    const ti = ORDER.indexOf(k), ci = ORDER.indexOf(MAP.cur), Lt = MAP.Ls[k], Lc = MAP.s;
    const df = ((Lt - Lc) % total + total) % total, db = total - df;
    const dir = df <= db ? 1 : -1, dist = Math.min(df, db);
    if (dist < 2 || ti === ci) { MAP.cur = k; MAP.s = Lt; setTokenAt(Lt); moveToken(k); MAP.anim = 0; cb && cb(); return; }
    const lit = []; let i = ci;
    if (dir > 0) { while (i !== ti) { lit.push(i); i = (i + 1) % 6; } }
    else { while (i !== ti) { i = (i + 5) % 6; lit.push(i); } }
    document.querySelectorAll('.place').forEach(p => p.classList.remove('active'));
    const dur = clamp(dist / 300 * 1000, 800, 2300), t0 = performance.now(), tk = $('token');
    tk.classList.add('walking');
    let lastStep = 0;
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const frame = now => {
        const t = clamp((now - t0) / dur, 0, 1);
        setTokenAt(Lc + dir * dist * ease(t), dir);
        if (now - lastStep > 230) { lastStep = now; sfx('step'); spawnDust(MAP.tx, MAP.ty); }
        if (t < 1) { MAP.anim = requestAnimationFrame(frame); return; }
        MAP.anim = 0; MAP.s = Lt; MAP.cur = k; setTokenAt(Lt, dir);
        tk.classList.remove('walking'); moveToken(k);
        lit.forEach((si, n) => setTimeout(() => { MAP.lit.add(si); const el = $('lit' + si); el && el.classList.add('on'); }, n * 220));
        cb && cb();
    };
    MAP.anim = requestAnimationFrame(frame);
}

function nextEvent() {

    if (S.age >= lifeEnd()) return S.done.has('final') ? null : EV_FINAL;
    const c = EV.filter(e => e.id !== 'final' && !S.done.has(e.id) &&
        S.age >= e.a[0] && S.age <= e.a[1] && (!e.req || e.req(S)));
    if (!c.length) return 'skip';
    c.sort((x, y) => (x.a[1] - S.age) - (y.a[1] - S.age));
    const top = c.slice(0, 3);
    return top[Math.floor(Math.random() * top.length)];
}
function advance(y) {
    S.age += y;
    if (S.age > 50) S.h = clamp(S.h - Math.round(y * 0.8));

function runTurn() {
    if (!S) return;

function lifeTitle() {

    const avg = known.reduce((a, k) => a + S.b[k], 0) / known.length;
    const cands = [
        [S.h - 35, '一路走得很稳的人'],
        [S.j - 88, '把日子过成歌的人'],
        [S.w - 88, '一生好奇的人'],
        [S.m - 35, '丰足安稳的人'],
        [avg - 90, '被许多人惦记的人']
    ];
    cands.sort((a, b) => b[0] - a[0]);
    return cands[0][1];
}
function radarSVG() {
    const cx = 110, cy = 110, R = 76, keys = ['h', 'j', 'w', 'm'];
    const pt = (i, v) => { const a = -Math.PI / 2 + i * Math.PI / 2; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; };
    let g = '';
    [.25, .5, .75, 1].forEach(v => { g += `<polygon points="${keys.map((_, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.14)"/>`; });
    keys.forEach((k, i) => {
        const e = pt(i, 1), l = pt(i, 1.3);
        g += `<line x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}" stroke="rgba(255,255,255,.12)"/>` +
            `<text x="${l[0]}" y="${l[1]}" fill="#c4cce0" font-size="12" text-anchor="middle" dominant-baseline="middle">${STAT[k][1]}${STAT[k][0]} ${Math.round(S[k])}</text>`;
    });
    g += `<polygon points="${keys.map((k, i) => pt(i, S[k] / 100).join(',')).join(' ')}" fill="rgba(255,209,102,.28)" stroke="#ffd166" stroke-width="2"/>`;
    keys.forEach((k, i) => { const p = pt(i, S[k] / 100); g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#ffd166"/>`; });
    return `<svg viewBox="-20 -6 260 232" width="260" height="232">${g}</svg>`;
}

/* ================= 氛围特效：星空 / 花瓣 / 萤火虫 / 落叶 ================= */
const FX = { on: false, x: null, sx: null, W: 0, H: 0, parts: [], stars: [], shoot: null, t: 0 };
function fxResize() {
    const w = $('world'), W = w.clientWidth, H = w.clientHeight;
    if (!W) return;
    FX.W = W; FX.H = H;
    ['fx', 'stars'].forEach(id => { const c = $(id); c.width = W; c.height = H; });
    FX.x = $('fx').getContext('2d'); FX.sx = $('stars').getContext('2d');
    FX.stars = [];
    for (let i = 0; i < 80; i++) FX.stars.push({ x: Math.random() * W, y: Math.random() * H * .26, r: Math.random() * 1.4 + .3, ph: Math.random() * 6.28, sp: .6 + Math.random() * 1.6 });
}
function fxStart() {
    if (FX.on) return;
    FX.on = true; FX.parts = []; FX.t = performance.now();
    requestAnimationFrame(fxLoop);
}
function newPart(kind, init) {
    const W = FX.W, H = FX.H;
    return {
        k: kind, x: Math.random() * W, y: init ? Math.random() * H : (kind === 1 || kind === 3 ? H + 10 : -10),
        vx: (Math.random() - .5) * 12, vy: kind === 1 ? -(6 + Math.random() * 10) : kind === 3 ? (Math.random() - .5) * 10 : 16 + Math.random() * 22,
        r: 1.6 + Math.random() * 1.6, ph: Math.random() * 6.28, rot: Math.random() * 6.28, age: 0, life: 9 + Math.random() * 9, c: rnd(3)
    };
}
function spawnDust(x, y) {
    if (!FX.on || !META.set.fx) return;
    for (let i = 0; i < 2; i++) FX.parts.push({ k: 4, x: x + (Math.random() - .5) * 10, y: y - 2, vx: (Math.random() - .5) * 18, vy: -6 - Math.random() * 10, r: 2 + Math.random() * 2, ph: 0, rot: 0, age: 0, life: .7, c: 0 });
}
function syncPause() {
    const p = overlayOpen();
    if (p !== FX.paused) { FX.paused = p; const ws = $('worldScreen'); if (ws) ws.classList.toggle('paused', p); }
}
function fxLoop(t) {
    if (!FX.on) return;
    requestAnimationFrame(fxLoop);
    if (document.hidden) return;
    const el = t - FX.t;
    if (el < 33) return;                      // 约 30fps，足够氛围粒子使用
    FX.t = t;
    if ((FX.n = (FX.n || 0) + 1) % 30 === 0) syncPause();
    if (FX.paused) return;                    // 弹窗/覆盖层打开时不再绘制
    const W = FX.W, H = FX.H, s = FX.sx, x = FX.x;
    if (!W || !S) return;
    const dt = Math.min(.06, el / 1000);
    const p = curP(), n = smooth(.76, .98, p);
    s.clearRect(0, 0, W, H);
    const sa = Math.max(n, .1 * (1 - smooth(0, .22, p)));
    if (sa > .01) {
        FX.stars.forEach(st => {
            s.globalAlpha = sa * (.55 + .45 * Math.sin(t / 1000 * st.sp + st.ph));
            s.fillStyle = '#fff'; s.beginPath(); s.arc(st.x, st.y, st.r, 0, 6.283); s.fill();
        });
        s.globalAlpha = 1;
        if (n > .5 && !FX.shoot && Math.random() < .004) FX.shoot = { x: Math.random() * W * .7, y: Math.random() * H * .12, life: 1 };
        if (FX.shoot) {
            const o = FX.shoot; o.x += 520 * dt; o.y += 220 * dt; o.life -= dt * 1.4;
            const g = s.createLinearGradient(o.x, o.y, o.x - 90, o.y - 38);
            g.addColorStop(0, `rgba(255,255,255,${Math.max(0, o.life)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
            s.strokeStyle = g; s.lineWidth = 2; s.beginPath(); s.moveTo(o.x, o.y); s.lineTo(o.x - 90, o.y - 38); s.stroke();
            if (o.life <= 0) FX.shoot = null;
        }
    }
    x.clearRect(0, 0, W, H);
    if (!META.set.fx) { FX.parts = []; return; }
    const kind = p < .22 ? 0 : p < .58 ? 1 : p < .86 ? 2 : 3;
    const amb = FX.parts.filter(q => q.k !== 4).length;
    for (let i = amb; i < 26; i++) FX.parts.push(newPart(kind, true));
    FX.parts = FX.parts.filter(q => {
        q.age += dt;
        if (q.age > q.life || q.x < -20 || q.x > W + 20 || q.y < -20 || q.y > H + 20) {
            if (q.k === 4) return false;
            Object.assign(q, newPart(kind, false)); return true;
        }
        if (q.k === 0 || q.k === 2) { q.x += (q.vx + Math.sin(q.age * 1.3 + q.ph) * 14) * dt; q.y += q.vy * dt; q.rot += dt * 1.5; }
        else if (q.k === 1) { q.x += (q.vx + Math.sin(q.age + q.ph) * 6) * dt; q.y += q.vy * dt; }
        else if (q.k === 3) { q.vx += (Math.random() - .5) * 30 * dt; q.vy += (Math.random() - .5) * 30 * dt; q.vx = clamp(q.vx, -22, 22, 0); q.vy = clamp(q.vy, -22, 22); q.x += q.vx * dt; q.y += q.vy * dt; }
        else { q.x += q.vx * dt; q.y += q.vy * dt; }
        const fade = Math.min(1, q.age * 2, (q.life - q.age) * 2);
        x.save(); x.globalAlpha = Math.max(0, fade);
        if (q.k === 0) { x.translate(q.x, q.y); x.rotate(q.rot); x.fillStyle = 'rgba(255,196,214,.9)'; x.beginPath(); x.ellipse(0, 0, 4.6, 2.4, 0, 0, 6.283); x.fill(); }
        else if (q.k === 1) { x.fillStyle = `rgba(255,240,170,${.45 + .4 * Math.sin(q.age * 3 + q.ph)})`; x.beginPath(); x.arc(q.x, q.y, q.r, 0, 6.283); x.fill(); }
        else if (q.k === 2) { x.translate(q.x, q.y); x.rotate(q.rot); x.fillStyle = ['#e0883a', '#c2542e', '#d9a93a'][q.c]; x.beginPath(); x.ellipse(0, 0, 5.4, 2.8, 0, 0, 6.283); x.fill(); }
        else if (q.k === 3) {
            const a = .55 + .45 * Math.sin(q.age * 3 + q.ph), g = x.createRadialGradient(q.x, q.y, 0, q.x, q.y, 11);
            g.addColorStop(0, `rgba(255,240,130,${a})`); g.addColorStop(1, 'rgba(255,240,130,0)');
            x.fillStyle = g; x.beginPath(); x.arc(q.x, q.y, 11, 0, 6.283); x.fill();
        } else { x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.arc(q.x, q.y, q.r * (1 + q.age), 0, 6.283); x.fill(); }
        x.restore();
        return true;
    });
}

function topOverlay() {
    return ['helpScreen', 'setScreen', 'achScreen', 'detailScreen', 'fragScreen', 'peopleScreen'].find(id => $(id).style.display === 'block');
}
document.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') return;
    const k = e.key;
    if (k === 'Escape') {
        const id = topOverlay();
        if (id && !(id === 'peopleScreen' && peopleMode)) hideOv(id);
        else if (!id && $('infoPanel').style.display === 'block') closePanel();
        return;
    }
    if (!S || $('worldScreen').style.display !== 'flex') return;
    if ($('eventModal').style.display === 'flex' && !topOverlay()) {
        const lk = k.toLowerCase();
        if (lk === 'p') { openPeople(false); return; } if (lk === 'f') { openFrags(); return; }
        if (lk === 'a') { openOv('ach'); return; } if (lk === 'h') { openHelp(); return; }
        if (/^[1-9]$/.test(k) && $('evChoicesWrap').style.display !== 'none') { const b = $('evChoices').children[+k - 1]; if (b) b.click(); }
        else if (k === 'Enter' || k === ' ') {
            e.preventDefault();
            if (TW.active) skipType(); else if ($('evResult').style.display === 'block') cont();
        }
        return;
    }
    if (topOverlay() || $('summary').style.display === 'block' || $('ending').style.display === 'flex') return;
    const l = k.toLowerCase();
    if (l === 'p') openPeople(false); else if (l === 'f') openFrags(); else if (l === 'a') openOv('ach'); else if (l === 'h') openHelp();
});

    const sc = $('scene');
    if (sc && S && !FX.paused) { sc.style.setProperty('--ry', (PAR.nx * 5).toFixed(2) + 'deg'); sc.style.setProperty('--rx', (16 - PAR.ny * 3).toFixed(2) + 'deg'); }
    const pv = $('preview'); if (pv) { pv.style.setProperty('--pry', (PAR.cx * 38).toFixed(1) + 'deg'); pv.style.setProperty('--prx', (-PAR.cy * 10).toFixed(1) + 'deg'); }
    const tm = $('tMap'), pl = tm && tm.querySelector('.tPlane'); if (pl) { pl.style.setProperty('--try', (PAR.tx * 6).toFixed(1) + 'deg'); pl.style.setProperty('--trx', (14 - PAR.ty * 3).toFixed(1) + 'deg'); }
}
Object.assign(PAR, { ex: 0, ey: 0, cx: 0, cy: 0, tx: 0, ty: 0 });
document.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    const W = window.innerWidth, H = window.innerHeight;
    const nx = e.clientX / W - .5, ny = e.clientY / H - .5;
    PAR.nx = nx; PAR.ny = ny; PAR.ex = nx * 2; PAR.ey = ny * 2; PAR.tx = nx; PAR.ty = ny;
    const st = document.querySelector('.previewBox .stage');
    if (st && $('createScreen').style.display === 'block') { const r = st.getBoundingClientRect(); PAR.cx = clamp(((e.clientX - r.left) / r.width - .5) * 2, -1, 1, 0); PAR.cy = clamp(((e.clientY - r.top) / r.height - .5) * 2, -1, 1, 0); }
    if (!PAR.raf) PAR.raf = requestAnimationFrame(parApply);
}, { passive: true });

/* ================= 启动 ================= */
loadMeta(); applyMusic(); buildTitle(); titleLoop();
</script>
</body>
