<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LifeWorld｜人生地图</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* ---------- 首页 ---------- */

#startScreen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    background:
        radial-gradient(circle at center,
        #25345c 0%,
        #111827 35%,
        #080b12 75%);
}

#startScreen h1 {
    font-size: 64px;
    margin: 0 0 15px;
    letter-spacing: 4px;
}

.subtitle {
    font-size: 20px;
    color: #aab4c8;
    margin-bottom: 50px;
}

button {
    border: none;
    padding: 13px 25px;
    border-radius: 30px;
    background: #ffffff;
    color: #111;
    font-size: 16px;
    cursor: pointer;
    transition: 0.25s;
}

button:hover {
    transform: scale(1.05);
}

/* ---------- 主世界 ---------- */

#worldScreen {
    display: none;
    height: 100vh;
    position: relative;
}

/* 地图 */

#world {
    width: 100%;
    height: 100%;

    background:
        radial-gradient(circle at 30% 40%, #19314c 0%, transparent 25%),
        radial-gradient(circle at 70% 65%, #30214b 0%, transparent 25%),
        #090d16;
}

/* 地图节点 */

.place {
    position: absolute;

    width: 130px;
    height: 130px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);

    cursor: pointer;

    backdrop-filter: blur(10px);

    transition: 0.3s;
}

.place:hover {
    transform: scale(1.15);
    background: rgba(255,255,255,0.18);
}

/* 地点位置 */

#home {
    left: 15%;
    top: 35%;
}

#university {
    left: 42%;
    top: 20%;
}

#travel {
    left: 70%;
    top: 35%;
}

#future {
    left: 55%;
    top: 70%;
}

/* 人物按钮 */

#peopleButton {
    position: absolute;
    top: 25px;
    right: 25px;
}

/* ---------- 信息窗口 ---------- */

#infoPanel {
    display: none;

    position: absolute;

    right: 30px;
    bottom: 30px;

    width: 350px;

    padding: 25px;

    border-radius: 20px;

    background: rgba(15,20,30,0.9);

    border: 1px solid rgba(255,255,255,0.15);

    backdrop-filter: blur(20px);
}

#infoPanel h2 {
    margin-top: 0;
}

.close {
    float: right;
    cursor: pointer;
    color: #aaa;
}

/* ---------- 人物选择 ---------- */

#peopleScreen {
    display: none;

    position: absolute;

    inset: 0;

    background: rgba(5,8,15,0.96);

    padding: 80px;

    text-align: center;
}

.people {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 50px;
}

.person {
    width: 150px;
    height: 150px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #1b2538;

    cursor: pointer;

    transition: 0.3s;
}

.person:hover {
    transform: scale(1.1);
    background: #35466b;
}

/* ---------- Ending ---------- */

#ending {
    display: none;

    position: absolute;

    inset: 0;

    background: #05070c;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    text-align: center;

    animation: fadeIn 3s;
}

#ending h1 {
    font-size: 42px;
    max-width: 800px;
    line-height: 1.5;
}

#ending p {
    color: #9299a8;
    font-size: 18px;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

</style>
</head>

<body>


<!-- ================= 首页 ================= -->

<div id="startScreen">

    <h1>LifeWorld</h1>

    <div class="subtitle">
        把碎片拼成世界，把世界留给眼前人。
    </div>

    <button onclick="startWorld()">
        开始构建我的世界
    </button>

</div>


<!-- ================= 世界 ================= -->

<div id="worldScreen">

    <div id="world">

        <!-- 地图地点 -->

        <div
            class="place"
            id="home"
            onclick="showPlace('home')">

            🏠<br>
            Home

        </div>


        <div
            class="place"
            id="university"
            onclick="showPlace('university')">

            🏫<br>
            University

        </div>


        <div
            class="place"
            id="travel"
            onclick="showPlace('travel')">

            ✈️<br>
            Travel

        </div>


        <div
            class="place"
            id="future"
            onclick="showPlace('future')">

            🚀<br>
            Future

        </div>

    </div>


    <!-- 人物按钮 -->

    <button
        id="peopleButton"
        onclick="openPeople()">

        👥 People in My World

    </button>


    <!-- 信息窗口 -->

    <div id="infoPanel">

        <span
            class="close"
            onclick="closePanel()">
            ✕
        </span>

        <h2 id="placeTitle"></h2>

        <p id="placeText"></p>

        <p id="placePeople"></p>

    </div>


    <!-- 人物选择 -->

    <div id="peopleScreen">

        <h1>Who makes your world meaningful?</h1>

        <p>
            选择一个你想留下的人
        </p>

        <div class="people">

            <div
                class="person"
                onclick="choosePerson('Mom')">

                👩<br>
                Mom

            </div>

            <div
                class="person"
                onclick="choosePerson('Friend')">

                🧑<br>
                Friend

            </div>

            <div
                class="person"
                onclick="choosePerson('Dad')">

                👨<br>
                Dad

            </div>

        </div>

    </div>


    <!-- Ending -->

    <div id="ending">

        <p>
            We thought we were building a world.
        </p>

        <h1>
            But a world is not made of places.
        </h1>

        <p>
            It is made of the people who were there with us.
        </p>

        <h1>
            比起关心天下事，<br>
            更好在于留下眼前人。
        </h1>

    </div>

</div>


<script>

/* ================= 开始 ================= */

function startWorld() {

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("worldScreen").style.display = "block";

}


/* ================= 地点 ================= */

function showPlace(place) {

    let title = "";
    let text = "";
    let people = "";

    if (place === "home") {

        title = "🏠 Home";

        text =
        "这里保存着与你的家庭有关的记忆。";

        people =
        "👤 People: Mom, Dad";

    }

    if (place === "university") {

        title = "🏫 University";

        text =
        "新的阶段从这里开始。学习、比赛、朋友，以及第一次尝试 AI。";

        people =
        "👤 People: Friends";

    }

    if (place === "travel") {

        title = "✈️ Travel";

        text =
        "一些地方最终会变成记忆，而一些记忆最终会变成故事。";

        people =
        "👤 People: Friends";

    }

    if (place === "future") {

        title = "🚀 Future";

        text =
        "这里还没有发生任何事情。它等待着你继续填满。";

        people =
        "⭐ Dreams & Goals";

    }


    document.getElementById("placeTitle").innerText = title;

    document.getElementById("placeText").innerText = text;

    document.getElementById("placePeople").innerText = people;

    document.getElementById("infoPanel").style.display = "block";

}


function closePanel() {

    document.getElementById("infoPanel").style.display = "none";

}


/* ================= 人物 ================= */

function openPeople() {

    document.getElementById("peopleScreen").style.display = "block";

}


function choosePerson(person) {

    document.getElementById("peopleScreen").style.display = "none";

    setTimeout(() => {

        document.getElementById("ending").style.display = "flex";

    }, 800);

}

</script>

</body>
</html>
